                };
                window.addEventListener('hs-auth-tab-change', h);
                return () => window.removeEventListener('hs-auth-tab-change', h);
            }, []);

            const switchTab = t => {
                window.__authTab = t;
                setTab(t);
                setError('');
                window.dispatchEvent(new Event('hs-auth-tab-change'));
            };

            const isValid = tab === 'login' ? password.length > 0 : passwordScore(password) === PASSWORD_RULES.length;

            const handleSubmit = async e => {
                e.preventDefault();
                setError('');
                if (tab === 'register' && !isValid) { setTouchedPass(true);
                    setError('كلمة المرور لا تحقق الشروط'); return; }
                setSubmitting(true);
                try {
                    if (tab === 'login') {
                        await onLogin(email, password);
                        document.getElementById('authModal').classList.add('hidden');
                    } else {
                        const r = await axiosInstance.post(EP.register, { farmName, ownerName, email, password });
                        if (r.data.accessToken) { persistSession(r.data);
                            window.location.reload(); }
                    }
                } catch (err) { setError(errMsg(err)); } finally { setSubmitting(false); }
            };

            return (
                <div className="modal-overlay hidden" id="authModal">
                    <div className="modal">
                        <button className="modal-close" onClick={() => document.getElementById('authModal').classList.add(
                            'hidden')}>✕</button>
                        <div className="auth-tabs">
                            <button className={`auth-tab ${tab === 'login' ? 'active' : ''}`} onClick={() =>
                                    switchTab('login')}>تسجيل الدخول</button>
                            <button className={`auth-tab ${tab === 'register' ? 'active' : ''}`} onClick={() =>
                                    switchTab('register')}>حساب جديد</button>
                        </div>
                        <form onSubmit={handleSubmit}>
                            {tab === 'register' && (
                                <>
                                    <div className="field"><label>اسم المزرعة</label><input type="text" value={farmName}
                                            onChange={e => setFarmName(e.target.value)} required /></div>
                                    <div className="field"><label>اسم المالك</label><input type="text" value={ownerName}
                                            onChange={e => setOwnerName(e.target.value)} required /></div>
                                </>
                            )}
                            <div className="field"><label>البريد الإلكتروني</label><input type="email" value={email}
                                    onChange={e => setEmail(e.target.value)} required /></div>
                            <div className="field"><label>كلمة المرور</label><input type="password" value={password} required
                                    onFocus={() => setTouchedPass(true)} onChange={e => setPassword(e.target
                                    .value)} />{tab === 'register' && (touchedPass || password.length > 0) && <
                                    PasswordChecklist password={password} />}</div>
                            {error && <div className="field-error">{error}</div>}
                            <div className="modal-actions">
                                <button type="submit" className="btn btn-solid" disabled={submitting || (tab ===
                                        'register' && !isValid)}>{submitting ? '...' : (tab === 'login' ? 'دخول' :
                                        'إنشاء')}</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        // ─── openAuthModal global ───
        window.openAuthModal = (tab = 'login') => {
            window.__authTab = tab;
            document.getElementById('authModal').classList.remove('hidden');
            window.dispatchEvent(new Event('hs-auth-tab-change'));
        };

        // ─── Root ───
        const Root = () => {
            const handleLogin = async (email, password) => {
                const r = await axiosInstance.post(EP.login, { email, password });
                persistSession(r.data);
                window.location.reload();
            };
            return (
                <>
                    <AuthModal onLogin={handleLogin} />
                    <App />
                </>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
    </script>
</body>
</html>
