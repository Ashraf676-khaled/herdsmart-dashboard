<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>هيردسمارت · نظام المزرعة الذكي</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=JetBrains+Mono&display=swap" rel="stylesheet" />
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js">
    </script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js">
    </script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.2/dist/axios.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/jwt-decode@4.0.0/build/jwt-decode.min.js">
    </script>
    <style>
        /* ─── reset & base ─── */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html {
            -webkit-text-size-adjust: 100%;
        }
        body {
            background: #F3EEDE;
            color: #202A1E;
            font-family: 'Tajawal', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }
        :root {
            --bg: #F3EEDE;
            --sidebar: #1F3A26;
            --card: #FFFDF5;
            --ink: #202A1E;
            --ink-soft: #5A6553;
            --green: #3C6B41;
            --green-deep: #1F3A26;
            --gold: #C79A45;
            --rust: #A85234;
            --line: #E1D6B4;
            --radius: 10px;
        }
        .num {
            font-family: 'JetBrains Mono', monospace;
        }
        button,
        select {
            font-family: inherit;
            cursor: pointer;
        }
        input {
            font-family: inherit;
            cursor: text;
        }

        /* ─── topbar ─── */
        .topbar {
            height: auto;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 12px;
            background: var(--card);
            border-bottom: 1px solid var(--line);
            flex-wrap: wrap;
            gap: 4px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 900;
            font-size: .95rem;
            color: var(--green-deep);
            flex-shrink: 0;
        }
        .brand .mark {
            width: 26px;
            height: 26px;
            border-radius: 7px;
            background: linear-gradient(155deg, var(--green), var(--green-deep));
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: .85rem;
            flex: none;
        }
        .top-right {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
            flex: 1;
            justify-content: flex-end;
        }
        .status-badge {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: .55rem;
            font-weight: 700;
            color: var(--ink-soft);
            background: var(--bg);
            border: 1px solid var(--line);
            padding: 2px 6px;
            border-radius: 999px;
        }
        .status-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #C9BE9C;
            flex: none;
        }
        .status-dot.on {
            background: var(--green);
            animation: pulseGreen 2s infinite;
        }
        @keyframes pulseGreen {
            0% {
                box-shadow: 0 0 0 0 rgba(60, 107, 65, .5);
            }
            70% {
                box-shadow: 0 0 0 8px rgba(60, 107, 65, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(60, 107, 65, 0);
            }
        }
        .user-chip {
            display: flex;
            align-items: center;
            gap: 4px;
            background: var(--bg);
            border: 1px solid var(--line);
            padding: 2px 8px;
            border-radius: 999px;
            font-size: .6rem;
            font-weight: 700;
            color: var(--green-deep);
            flex-shrink: 0;
        }
        .user-chip .role-tag {
            font-size: .5rem;
            font-weight: 700;
            background: var(--gold);
            color: var(--green-deep);
            padding: 1px 4px;
            border-radius: 999px;
        }
        .btn {
            padding: 4px 10px;
            border-radius: 7px;
            font-weight: 700;
            font-size: .65rem;
            border: 1.5px solid transparent;
            transition: all .12s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .btn-solid {
            background: var(--green-deep);
            color: #fff;
        }
        .btn-solid:hover:not(:disabled) {
            background: var(--green);
        }
        .btn-outline {
            background: transparent;
            border-color: var(--green-deep);
            color: var(--green-deep);
        }
        .btn-outline:hover:not(:disabled) {
            background: var(--green-deep);
            color: #fff;
        }
        .btn-small {
            padding: 2px 6px;
            font-size: .55rem;
            border-radius: 5px;
        }
        .btn:disabled {
            opacity: .5;
            cursor: not-allowed !important;
            filter: grayscale(.6);
            pointer-events: auto;
            transform: none !important;
        }
        .btn:disabled:hover {
            background: transparent !important;
            color: inherit !important;
            transform: none !important;
        }
        .btn-primary {
            background: var(--green);
            color: #fff;
            border-color: var(--green);
        }
        .btn-primary:hover:not(:disabled) {
            background: var(--green-deep);
            border-color: var(--green-deep);
        }
        .btn.locked {
            background: #E7E2CC !important;
            color: #8C8567 !important;
            border-color: #E7E2CC !important;
            filter: none;
            opacity: 1;
            cursor: not-allowed !important;
        }
        .btn.locked:hover {
            background: #E7E2CC !important;
            color: #8C8567 !important;
            transform: none !important;
        }
        .btn.locked .lock-ic {
            margin-left: 2px;
        }

        /* ─── app layout ─── */
        .app-body {
            display: flex;
            height: calc(100vh - 48px);
            position: relative;
        }

        /* ─── sidebar ─── */
        .sidebar {
            width: 50px;
            background: #1F3A26;
            color: #EFE9D6;
            padding: 6px 4px;
            flex: none;
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow-y: auto;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            padding: 6px 2px;
            border-radius: 7px;
            color: #D9D3B8;
            font-weight: 600;
            font-size: .5rem;
            background: transparent;
            border: none;
            width: 100%;
            text-align: center;
            transition: all .12s;
        }
        .nav-item:hover {
            background: #2B4B33;
            color: #fff;
        }
        .nav-item.active {
            background: var(--gold);
            color: var(--green-deep);
        }
        .nav-item .nav-icon {
            font-size: 1.1rem;
        }
        .nav-item .label {
            font-size: .45rem;
        }
        .sidebar-foot {
            margin-top: auto;
            font-size: .4rem;
            color: #93A088;
            padding: 4px;
            text-align: center;
        }

        /* ─── content ─── */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 8px 10px;
            -webkit-overflow-scrolling: touch;
        }
        .view {
            display: none;
            animation: fadein .2s ease;
        }
        .view.active {
            display: block;
        }
        @keyframes fadein {
            from {
                opacity: 0;
                transform: translateY(5px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .view-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            flex-wrap: wrap;
            gap: 4px;
        }
        .view-head h1 {
            font-size: 1rem;
            color: var(--green-deep);
            font-weight: 900;
        }
        .view-head p {
            color: var(--ink-soft);
            font-size: .65rem;
        }

        /* ─── cards ─── */
        .card-box {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 10px;
            margin-bottom: 8px;
            transition: box-shadow .15s;
        }
        .card-box:hover {
            box-shadow: 0 3px 10px -6px rgba(31, 58, 38, .15);
        }
        .card-box h4 {
            color: var(--green-deep);
            margin-bottom: 6px;
            font-size: .75rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 4px;
        }

        /* ─── tables ─── */
        .table-scroll {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: .65rem;
            min-width: 320px;
        }
        th {
            text-align: right;
            color: var(--ink-soft);
            font-weight: 700;
            font-size: .55rem;
            padding: 3px 5px;
            border-bottom: 1px solid var(--line);
            white-space: nowrap;
        }
        td {
            padding: 3px 5px;
            border-bottom: 1px solid var(--line);
        }
        tr:last-child td {
            border-bottom: none;
        }
        tbody tr:hover {
            background: #FAF6E8;
        }
        .empty-row td {
            color: var(--ink-soft);
            text-align: center;
            padding: 10px;
        }

        /* ─── badges ─── */
        .badge {
            display: inline-block;
            padding: 1px 6px;
            border-radius: 999px;
            font-size: .5rem;
            font-weight: 700;
        }
        .badge.ok {
            background: #DEEAD9;
            color: var(--green-deep);
        }
        .badge.pending {
            background: #F1E3BE;
            color: var(--gold);
        }
        .badge.active {
            background: #F3DAD1;
            color: var(--rust);
        }
        .badge.sold {
            background: #E7E2CC;
            color: #6B6547;
        }
        .badge.dead {
            background: #EAD6D6;
            color: #8A3A3A;
        }

        /* ─── forms ─── */
        .field {
            margin-bottom: 8px;
        }
        .field label {
            display: block;
            font-size: .65rem;
            font-weight: 700;
            color: var(--ink-soft);
            margin-bottom: 2px;
        }
        .field input,
        .field select {
            width: 100%;
            padding: 5px 8px;
            border: 1px solid var(--line);
            border-radius: 5px;
            background: #fff;
            font-size: .75rem;
            color: var(--ink);
        }
        .field input:focus,
        .field select:focus {
            outline: 0;
            border-color: var(--green);
            box-shadow: 0 0 0 3px rgba(60, 107, 65, .08);
        }
        .field input:disabled,
        .field select:disabled {
            background: #f0f0f0;
            opacity: .6;
            cursor: not-allowed;
        }
        .field-error {
            color: var(--rust);
            font-size: .6rem;
            margin-top: 2px;
            display: block;
        }
        .form-grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .form-grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }
        .modal-actions {
            display: flex;
            gap: 6px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .modal-actions .btn {
            flex: 1;
            text-align: center;
            min-width: 50px;
        }

        /* ─── toast ─── */
        #toast-wrap {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 200;
            display: flex;
            flex-direction: column;
            gap: 4px;
            width: 90%;
            max-width: 340px;
            pointer-events: none;
        }
        .toast {
            background: var(--green-deep);
            color: #fff;
            padding: 6px 12px;
            border-radius: 7px;
            font-size: .7rem;
            font-weight: 600;
            box-shadow: 0 5px 14px -5px rgba(0, 0, 0, .3);
            animation: toastin .25s ease;
            pointer-events: auto;
            text-align: center;
        }
        .toast.error {
            background: var(--rust);
        }
        @keyframes toastin {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ─── modal ─── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(20, 26, 17, .5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            backdrop-filter: blur(2px);
            padding: 12px;
        }
        .modal-overlay.hidden {
            display: none;
        }
        .modal {
            background: var(--card);
            border-radius: 12px;
            padding: 14px;
            width: 100%;
            max-width: 360px;
            border: 1px solid var(--line);
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            animation: modalIn .2s ease;
        }
        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(.95) translateY(12px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .modal-close {
            position: absolute;
            top: 6px;
            left: 6px;
            background: 0 0;
            border: none;
            font-size: .9rem;
            color: var(--ink-soft);
            cursor: pointer;
        }

        /* ─── auth tabs ─── */
        .auth-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 10px;
            background: var(--bg);
            border-radius: 7px;
            padding: 3px;
        }
        .auth-tab {
            flex: 1;
            padding: 4px;
            text-align: center;
            border-radius: 5px;
            font-weight: 700;
            font-size: .7rem;
            color: var(--ink-soft);
            border: none;
            background: 0 0;
        }
        .auth-tab.active {
            background: var(--green-deep);
            color: #fff;
        }

        /* ─── role switch ─── */
        .role-switch {
            display: flex;
            align-items: center;
            gap: 3px;
            background: var(--bg);
            border: 1px solid var(--line);
            padding: 2px 6px;
            border-radius: 999px;
            font-size: .6rem;
            color: var(--ink-soft);
            font-weight: 700;
            flex-shrink: 0;
        }
        .role-switch .label {
            font-size: .5rem;
            color: var(--ink-soft);
        }
        .role-switch select {
            border: none;
            background: 0 0;
            font-weight: 700;
            color: var(--green-deep);
            font-size: .6rem;
            padding: 0 2px;
        }

        /* ─── stats ─── */
        .stat-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
            gap: 6px;
            margin-bottom: 8px;
        }
        .stat-card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 8px;
            transition: transform .12s;
        }
        .stat-card:hover {
            transform: translateY(-2px);
        }
        .stat-card .label {
            font-size: .55rem;
            color: var(--ink-soft);
            font-weight: 700;
            margin-bottom: 2px;
        }
        .stat-card .value {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--green-deep);
        }
        .stat-card .value.rust {
            color: var(--rust);
        }
        .stat-card .sub {
            font-size: .5rem;
            color: var(--ink-soft);
            margin-top: 2px;
        }

        /* ─── gauges ─── */
        .gauge-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }
        .gauge {
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 7px;
            padding: 8px;
            text-align: center;
        }
        .gauge .g-label {
            font-size: .6rem;
            color: var(--ink-soft);
            font-weight: 700;
            margin-bottom: 2px;
        }
        .gauge .g-value {
            font-size: 1rem;
            font-weight: 700;
        }
        .gauge .g-bar {
            height: 4px;
            border-radius: 4px;
            background: var(--line);
            margin-top: 4px;
            overflow: hidden;
        }
        .gauge .g-fill {
            height: 100%;
            border-radius: 4px;
            transition: width .5s cubic-bezier(.4, 0, .2, 1), background .3s;
        }

        /* ─── producer row ─── */
        .producer-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 3px 0;
            border-bottom: 1px solid var(--line);
        }
        .producer-row:last-child {
            border-bottom: none;
        }
        .producer-row .liters {
            font-weight: 600;
            color: var(--rust);
            font-size: .65rem;
        }

        /* ─── alerts ─── */
        .alert-item {
            display: flex;
            gap: 6px;
            padding: 5px 0;
            border-bottom: 1px solid var(--line);
            align-items: flex-start;
        }
        .alert-item:last-child {
            border-bottom: none;
        }
        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            margin-top: 3px;
            flex: none;
        }
        .dot.red {
            background: var(--rust);
            animation: pulse 1.8s infinite;
        }
        .dot.gray {
            background: #C9BE9C;
        }
        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(168, 82, 52, .6);
            }
            70% {
                box-shadow: 0 0 0 8px rgba(168, 82, 52, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(168, 82, 52, 0);
            }
        }
        .alert-item .meta {
            font-size: .55rem;
            color: var(--ink-soft);
            margin-top: 1px;
        }
        .alert-item .body {
            flex: 1;
            min-width: 100px;
        }
        .alert-actions {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }

        /* ─── panels ─── */
        .panel-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            font-size: .5rem;
            font-weight: 700;
            color: var(--rust);
        }
        .live-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--rust);
            animation: pulse 1.8s infinite;
        }

        /* ─── tooltip ─── */
        .tip-wrap {
            position: relative;
            display: inline-flex;
        }
        .tip-wrap .tip-bubble {
            position: absolute;
            bottom: calc(100% + 5px);
            right: 50%;
            transform: translateX(50%) translateY(3px);
            background: var(--green-deep);
            color: #fff;
            font-size: .5rem;
            font-weight: 600;
            padding: 3px 6px;
            border-radius: 5px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity .12s, transform .12s;
            z-index: 20;
        }
        .tip-wrap .tip-bubble::after {
            content: '';
            position: absolute;
            top: 100%;
            right: 50%;
            transform: translateX(50%);
            border: 4px solid transparent;
            border-top-color: var(--green-deep);
        }
        .tip-wrap:hover .tip-bubble,
        .tip-wrap:focus-within .tip-bubble {
            opacity: 1;
            transform: translateX(50%) translateY(0);
        }

        /* ─── password checklist ─── */
        .pw-checklist {
            list-style: none;
            margin-top: 4px;
            display: grid;
            gap: 2px;
            padding: 5px 7px;
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 5px;
        }
        .pw-checklist li {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: .55rem;
            color: var(--ink-soft);
            font-weight: 600;
        }
        .pw-checklist li .pw-ic {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: .4rem;
            background: #E1D6B4;
            color: #fff;
            flex: none;
        }
        .pw-checklist li.ok {
            color: var(--green-deep);
        }
        .pw-checklist li.ok .pw-ic {
            background: var(--green);
        }
        .pw-strength-bar {
            height: 3px;
            border-radius: 4px;
            background: var(--line);
            margin-top: 4px;
            overflow: hidden;
        }
        .pw-strength-fill {
            height: 100%;
            border-radius: 4px;
            transition: width .3s, background .3s;
        }
        .gender-ic {
            font-size: .7rem;
        }

        /* ─── feature hero ─── */
        .feature-hero {
            background: linear-gradient(135deg, var(--green-deep), var(--green) 120%);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
            color: #F3EEDE;
            position: relative;
            overflow: hidden;
        }
        .feature-hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 85% 20%, rgba(199, 154, 69, .2), transparent 55%);
        }
        .feature-hero h2,
        .feature-hero p,
        .feature-grid,
        .feature-hero .modal-actions {
            position: relative;
        }
        .feature-hero h2 {
            font-size: .9rem;
            font-weight: 900;
            margin-bottom: 3px;
        }
        .feature-hero p {
            font-size: .7rem;
            opacity: .85;
            max-width: 400px;
        }
        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 5px;
            margin-top: 8px;
        }
        .feature-chip {
            background: rgba(255, 255, 255, .1);

<body>
    <div id="root"></div>
    <div id="toast-wrap"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback, createContext, useContext } = React;
        const API_BASE = 'https://herdsmart.runasp.net/api';
        const EP = {
            login: '/Auth/login',
            register: '/Auth/register',
            refresh: '/Auth/refresh-token',
            vaccines: '/vaccines',
            vaccinations: '/vaccinations',
            vaccAdminister: id => `/vaccinations/${id}/administer`,
            healthLogs: '/health-logs',
            cattle: '/Cattle',
            cattleOne: id => `/Cattle/${id}`,
            cattleStatus: id => `/Cattle/${id}/status`,
            users: '/users',
            milk: '/milk',
            milkTop: '/milk/top-producers',
            milkSummary: '/milk/summary'
        };

        // ─── role maps ───
        const ROLE_INT_MAP = { 0: 'Owner', 1: 'Vet', 2: 'Worker' };
        const ROLE_STRING_TO_INT = { Owner: 0, Vet: 1, Worker: 2 };
        const ROLES_DEF = {
            Owner: ['create_cattle', 'edit_cattle', 'delete_cattle', 'schedule_vaccination', 'view', 'manageStaff',
                'resolve_alerts'
            ],
            Vet: ['create_cattle', 'edit_cattle', 'create_vaccine', 'schedule_vaccination', 'administer_vaccination',
                'create_health', 'edit_health', 'view', 'resolve_alerts'
            ],
            Worker: ['view'],
            Guest: ['view']
        };
        const roleNames = { Owner: 'مالك المزرعة', Vet: 'بيطري', Worker: 'عامل', Guest: 'ضيف' };

        // ─── constants ───
        const GENDER_MAP = { 0: { label: 'ذكر', icon: '♂️' }, 1: { label: 'أنثى', icon: '♀️' } };
        const CATTLE_STATUS_MAP = {
            0: { label: 'نشطة', cls: 'ok' },
            1: { label: 'مريضة', cls: 'active' },
            2: { label: 'حامل', cls: 'pending' },
            3: { label: 'مباعة', cls: 'sold' },
            4: { label: 'نافقة', cls: 'dead' }
        };

        // ─── mock ───
        const MOCK = {
            vaccines: [
                { id: 'v1', name: 'الحمى القلاعية', targetAgeInMonths: 3, dosage: 2, intervalInDays: null },
                { id: 'v2', name: 'البروسيلا', targetAgeInMonths: 6, dosage: 1.5, intervalInDays: 30 },
                { id: 'v3', name: 'الجمرة الخبيثة', targetAgeInMonths: 12, dosage: 3, intervalInDays: null }
            ],
            vaccinations: [
                { id: 'vc1', cattleTagNumber: 'A102', vaccineName: 'الحمى القلاعية', scheduledDate: '2026-07-10T00:00:00',
                    administeredDate: null },
                { id: 'vc2', cattleTagNumber: 'A245', vaccineName: 'البروسيلا', scheduledDate: '2026-08-01T00:00:00',
                    administeredDate: null },
                { id: 'vc3', cattleTagNumber: 'A088', vaccineName: 'الجمرة الخبيثة', scheduledDate: '2026-06-15T00:00:00',
                    administeredDate: '2026-06-15T00:00:00' }
            ],
            healthLogs: [
                { id: 'h1', cattleTagNumber: 'A088', diagnosis: 'التهاب الضرع', treatmentPlan: 'مضاد حيوي موضعي 5 أيام',
                    isContagious: false },
                { id: 'h2', cattleTagNumber: 'A245', diagnosis: 'عرج خفيف', treatmentPlan: 'راحة وتقليم الأظلاف',
                    isContagious: false }
            ],
            cattle: [
                { id: 'c1', tagNumber: 'A102', breed: 'هولشتاين', gender: 0, birthDate: '2023-02-11T00:00:00',
                    status: 0, fatherTagNumber: null, motherTagNumber: 'A050' },
                { id: 'c2', tagNumber: 'A245', breed: 'بلدي', gender: 0, birthDate: '2022-08-03T00:00:00', status: 0,
                    fatherTagNumber: 'A010', motherTagNumber: null },
                { id: 'c3', tagNumber: 'A310', breed: 'جيرسي', gender: 1, birthDate: '2023-11-20T00:00:00', status: 2,
                    fatherTagNumber: null, motherTagNumber: null },
                { id: 'c4', tagNumber: 'A088', breed: 'هولشتاين', gender: 1, birthDate: '2021-05-14T00:00:00',
                    status: 1, fatherTagNumber: null, motherTagNumber: null }
            ],
            staff: [
                { id: 's1', fullName: 'د. كريم عادل', email: 'kareem@farm.com', role: 'Vet' },
                { id: 's2', fullName: 'أميرة فوزي', email: 'amira@farm.com', role: 'Worker' },
                { id: 's3', fullName: 'محمود الجندي', email: 'mahmoud@farm.com', role: 'Worker' }
            ],
            weeklyMilk: [1620, 1710, 1690, 1780, 1750, 1810, 1840],
            topProducers: [
                { tagNumber: 'A102', totalLiters: 27.4 },
                { tagNumber: 'A245', totalLiters: 25.1 },
                { tagNumber: 'A310', totalLiters: 24.6 }
            ],
            alerts: [
                { id: 'a1', text: 'ارتفاع درجة الحرارة — البقرة #A102 (8.7/10)', time: 'الآن', active: true },
                { id: 'a2', text: 'مستوى حركة منخفض — البقرة #A245 (2.1/10)', time: 'منذ 5 دقائق', active: true }
            ]
        };

        // ─── axios instance ───
        const axiosInstance = axios.create({ baseURL: API_BASE, headers: { 'Content-Type': 'application/json' } });
        axiosInstance.interceptors.request.use(c => {
            const t = localStorage.getItem('hs_token');
            if (t) c.headers.Authorization = `Bearer ${t}`;
            return c;
        });

        let isRefreshing = false,
            failedQueue = [];
        const processQueue = (e, t = null) => {
            failedQueue.forEach(p => e ? p.reject(e) : p.resolve(t));
            failedQueue = [];
        };

        axiosInstance.interceptors.response.use(r => r, async e => {
            const o = e.config;
            // تخطي معالجة 401 لطلب تسجيل الدخول
            if (o.url.includes('/Auth/login')) return Promise.reject(e);
            if (e.response?.status === 401 && !o._retry) {
                if (isRefreshing) {
                    return new Promise((r, j) => { failedQueue.push({ resolve: r, reject: j }); })
                        .then(t => { o.headers.Authorization = `Bearer ${t}`; return axiosInstance(o); })
                        .catch(r => Promise.reject(r));
                }
                o._retry = true;
                isRefreshing = true;
                const rt = localStorage.getItem('hs_refreshToken');
                if (!rt) { isRefreshing = false; performLogout(); return Promise.reject(e); }
                try {
                    const r = await axios.post(API_BASE + EP.refresh, {
                        refreshToken: rt,
                        accessToken: localStorage.getItem('hs_token')
                    });
                    const nt = r.data.accessToken;
                    localStorage.setItem('hs_token', nt);
                    if (r.data.refreshToken) localStorage.setItem('hs_refreshToken', r.data.refreshToken);
                    processQueue(null, nt);
                    o.headers.Authorization = `Bearer ${nt}`;
                    return axiosInstance(o);
                } catch (er) {
                    processQueue(er, null);
                    performLogout();
                    showToast('انتهت الجلسة، يرجى تسجيل الدخول مجدداً', true);
                    return Promise.reject(er);
                } finally { isRefreshing = false; }
            }
            if (e.response?.status === 401 && !o.url.includes('/Auth/login')) { performLogout(); }
            return Promise.reject(e);
        });

        // ─── toast ───
        function showToast(m, e = false) {
            const w = document.getElementById('toast-wrap'),
                el = document.createElement('div');
            el.className = `toast ${e ? 'error' : ''}`;
            el.textContent = m;
            w.appendChild(el);
            setTimeout(() => el.remove(), 3500);
        }

        // ─── error translation ───
        const ERROR_TRANSLATIONS = [
            { test: /invalid\s*(email|username)?\s*(or|\/)\s*password|incorrect/i, ar: 'البريد أو كلمة المرور غير صحيحة' },
            { test: /user\s*not\s*found|account\s*not\s*found/i, ar: 'لا يوجد حساب بهذا البريد' },
            { test: /already\s*(exists|registered|taken|in\s*use)/i, ar: 'هذا البريد مستخدم بالفعل' },
            { test: /unauthorized/i, ar: 'بيانات الدخول غير صحيحة' },
            { test: /forbidden|not\s*allowed|permission\s*denied/i, ar: 'ليس لديك صلاحية' },
            { test: /not\s*found/i, ar: 'العنصر غير موجود' },
            { test: /network\s*error/i, ar: 'تعذر الاتصال بالخادم' },
            { test: /is\s*required|cannot\s*be\s*empty|field\s*is\s*required/i, ar: 'حقل مطلوب' },
            { test: /invalid\s*email/i, ar: 'صيغة البريد غير صحيحة' },
            { test: /password.*(short|weak|length|characters)/i, ar: 'كلمة المرور لا تحقق الشروط' },
            { test: /token\s*expired|expired\s*token/i, ar: 'انتهت صلاحية الجلسة' },
            { test: /server\s*error|internal\s*server/i, ar: 'خطأ في الخادم' },
            { test: /rate\s*limit|too\s*many\s*requests/i, ar: 'محاولات كثيرة جداً' }
        ];

        function translateErrorMessage(r) {
            if (!r || typeof r !== 'string') return null;
            for (const t of ERROR_TRANSLATIONS) { if (t.test.test(r)) return t.ar; }
            if (/[\u0600-\u06FF]/.test(r)) return r;
            return null;
        }

        function errMsg(e, f = 'حدث خطأ غير متوقع') {
            if (!e) return f;
            const d = e.response?.data;
            let msgs = [];
            if (d) {
                if (d.message) msgs.push(d.message);
                if (d.title) msgs.push(d.title);
                if (d.errors && typeof d.errors === 'object') {
                    const m = Object.values(d.errors).flat().filter(Boolean);
                    msgs.push(...m);
                }
                if (d.detail) msgs.push(d.detail);
            }
            if (e.message) msgs.push(e.message);
            const tr = msgs.map(translateErrorMessage).filter(Boolean);
            if (tr.length) return [...new Set(tr)].join(' | ');
            if (e.response?.status === 401) return 'البريد أو كلمة المرور غير صحيحة';
            if (e.response?.status === 403) return 'ليس لديك صلاحية';
            if (e.response?.status === 404) return 'العنصر غير موجود';
            if (e.response?.status === 409) return 'هذه البيانات مسجّلة بالفعل';
            if (e.response?.status >= 500) return 'حدث خطأ في الخادم';
            return f;
        }

        // ─── session helpers ───
        function getToken() { return localStorage.getItem('hs_token'); }

        function isLoggedIn() { return !!getToken(); }

        function clearSession() { ['hs_token', 'hs_refreshToken', 'hs_role', 'hs_name'].forEach(k => localStorage.removeItem(
            k)); }

        function performLogout() { clearSession();
            window.location.reload(); }
        window.logout = performLogout;

        function decodeToken(t) {
            try {
                const d = jwtDecode(t);
                let raw = d.role || d.roles || null;
                if (!raw) {
                    const claims = [
                        'http://schemas.microsoft.com/ws/2008/06/identity/claims/role',
                        'http://schemas.microsoft.com/ws/2008/06/identity/claims/roles',
                        'http://schemas.xmlsoap.org/ws/2005/05/identity/claims/role',
                        'http://schemas.xmlsoap.org/ws/2005/05/identity/claims/roles'
                    ].filter(v => v !== undefined && v !== null);
                    for (const c of claims) { if (c) { raw = c; break; } }
                }
                let roles = [];
                if (Array.isArray(raw)) roles = raw;
                else if (raw !== undefined && raw !== null) roles = [raw];
                roles = roles.map(r => {
                    if (typeof r === 'number') return ROLE_INT_MAP[r] || String(r);
                    if (typeof r === 'string') {
                        const n = Number(r);
                        if (!isNaN(n)) return ROLE_INT_MAP[n] || r;
                        const l = r.toLowerCase();
                        if (l === 'owner' || l === 'farmowner') return 'Owner';
                        if (l === 'vet') return 'Vet';
                        if (l === 'worker') return 'Worker';
                        return r;
                    }
                    return String(r);
                }).filter(Boolean);
                const name = d['http://schemas.xmlsoap.org/ws/2005/05/identity/claims/name'] ||
                    d['http://schemas.microsoft.com/ws/2008/06/identity/claims/name'] ||
                    d.name || d.unique_name || d.sub || 'مستخدم';
                return { roles, primaryRole: roles[0] || 'Guest', name };
            } catch (e) { return { roles: ['Guest'], primaryRole: 'Guest', name: 'ضيف' }; }
        }

        function persistSession(d) {
            localStorage.setItem('hs_token', d.accessToken);
            if (d.refreshToken) localStorage.setItem('hs_refreshToken', d.refreshToken);
            let role = d.role || 'Guest',
                name = d.fullName || 'مستخدم';
            if (!d.role) {
                const dec = decodeToken(d.accessToken);
                role = dec.primaryRole || 'Guest';
                name = dec.name || d.fullName || 'مستخدم';
            } else {
                const k = typeof role === 'string' ? role : ROLE_INT_MAP[role];
                if (k && roleNames[k]) role = k;
                else {
                    const n = Number(role);
                    if (!isNaN(n) && ROLE_INT_MAP[n]) role = ROLE_INT_MAP[n];
                }
            }
            localStorage.setItem('hs_role', role);
            localStorage.setItem('hs_name', name);
        }

        // ─── AuthContext ───
        const AuthContext = createContext(null);

        function AuthProvider({ children, value }) {
            return <AuthContext.Provider value={value}>{children}</AuthContext.Provider>;
        }

        function useAuth() {
            const c = useContext(AuthContext);
            if (!c) throw new Error('useAuth must be used within AuthProvider');
            return c;
        }

        // ─── ActionButton ───
        function ActionButton({ allowed, reason, onClick, children, className = '', small = true }) {
            if (allowed) {
                return (
                    <button type="button" className={`btn ${small ? 'btn-small' : ''} ${className}`} onClick={onClick}>
                        {children}
                    </button>
                );
            }
            return (
                <span className="tip-wrap" tabIndex={0}>
                    <button type="button" className={`btn ${small ? 'btn-small' : ''} locked`} disabled onClick={e => e
                            .preventDefault()}>
                        <span className="lock-ic">🔒</span>
                        {children}
                    </button>
                    <span className="tip-bubble">{reason || 'لا تملك صلاحية هذا الإجراء'}</span>
                </span>
            );
        }

        // ─── password helpers ───
        const PASSWORD_RULES = [
            { key: 'len', label: '8 أحرف', test: p => p.length >= 8 },
            { key: 'upper', label: 'حرف كبير (A-Z)', test: p => /[A-Z]/.test(p) },
            { key: 'lower', label: 'حرف صغير (a-z)', test: p => /[a-z]/.test(p) },
            { key: 'num', label: 'رقم (0-9)', test: p => /[0-9]/.test(p) },
            { key: 'special', label: 'رمز خاص (!@#$...)', test: p => /[^A-Za-z0-9]/.test(p) }
        ];

        function passwordScore(p) { return PASSWORD_RULES.filter(r => r.test(p)).length; }

        function PasswordChecklist({ password }) {
            const s = passwordScore(password),
                pct = (s / PASSWORD_RULES.length) * 100,
                c = s <= 1 ? 'var(--rust)' : s <= 3 ? 'var(--gold)' : 'var(--green)';
            return (
                <div>
                    <div className="pw-strength-bar">
                        <div className="pw-strength-fill" style={{ width: pct + '%', background: c }}></div>
                    </div>
                    <ul className="pw-checklist">
                        {PASSWORD_RULES.map(r => {
                            const ok = r.test(password);
                            return <li key={r.key} className={ok ? 'ok' : ''}>
                                <span className="pw-ic">{ok ? '✓' : '•'}</span>
                                {r.label}
                            </li>;
                        })}
                    </ul>
                </div>
            );
        }

        // ─── App ───
        function App() {
            const [user, setUser] = useState(null);
            const [activeView, setActiveView] = useState('dashboard');
            const [loading, setLoading] = useState(false);
            const [currentRole, setCurrentRole] = useState('Guest');
            const [demoRole, setDemoRole] = useState('Owner');
            const [isReal, setIsReal] = useState(false);
            const [loadError, setLoadError] = useState(false);

            const [vaccines, setVaccines] = useState([]);
            const [vaccinations, setVaccinations] = useState([]);
            const [healthLogs, setHealthLogs] = useState([]);
            const [cattleOpts, setCattleOpts] = useState([]);
            const [cattleList, setCattleList] = useState([]);
            const [cattleTotal, setCattleTotal] = useState(0);
            const [staffList, setStaffList] = useState([]);
            const [weeklyMilk, setWeeklyMilk] = useState([]);
            const [topProducers, setTopProducers] = useState([]);
            const [alerts, setAlerts] = useState([]);
            const [dailyMilk, setDailyMilk] = useState('—');

            const [showVaccineForm, setShowVaccineForm] = useState(false);
            const [showVaccinationForm, setShowVaccinationForm] = useState(false);
            const [showHealthForm, setShowHealthForm] = useState(false);
            const [showCattleForm, setShowCattleForm] = useState(false);

            const effectiveRole = isLoggedIn() ? currentRole : demoRole;
            const perms = useMemo(() => ROLES_DEF[effectiveRole] || ROLES_DEF.Guest || ['view'], [effectiveRole]);
            const hasPermission = useCallback(a => perms.includes(a), [perms]);

            // ── loadData ──
            const loadData = useCallback(async () => {
                if (isLoggedIn()) {
                    setLoading(true);
                    setLoadError(false);
                    const safe = (p, f) => p.catch(() => f);
                    try {
                        const [vacs, vaccs, logs, cattleRes, staff, top] = await Promise.all([
                            safe(axiosInstance.get(EP.vaccines + '?Page=1&PageSize=100').then(r => r.data.items || []),
                                []),
                            safe(axiosInstance.get(EP.vaccinations + '?Page=1&PageSize=100').then(r => r.data.items ||
                                []), []),
                            safe(axiosInstance.get(EP.healthLogs + '?Page=1&PageSize=100').then(r => r.data.items ||
                                []), []),
                            safe(axiosInstance.get(EP.cattle + '?Page=1&PageSize=100').then(r => r.data), { items: [],
                                totalCount: 0 }),
                            safe(axiosInstance.get(EP.users + '?Page=1&PageSize=100').then(r => r.data.items || []),
                                []),
                            safe(axiosInstance.get(EP.milkTop + '?Top=5').then(r => r.data || []), [])
                        ]);
                        setVaccines(vacs);
                        setVaccinations(vaccs);
                        setHealthLogs(logs);
                        const cItems = cattleRes.items || [];
                        setCattleList(cItems);
                        setCattleOpts(cItems.map(c => ({ id: c.id, tagNumber: c.tagNumber })));
                        setCattleTotal(cattleRes.totalCount ?? cItems.length);
                        setStaffList(staff);
                        setTopProducers(top);

                        // weekly milk
                        const days = Array.from({ length: 7 }, (_, i) => 6 - i).map(i => {
                            const d = new Date();
                            d.setDate(d.getDate() - i);
                            const f = new Date(d);
                            f.setHours(0, 0, 0, 0);
                            const t = new Date(d);
                            t.setHours(23, 59, 59, 999);
                            return { from: f, to: t };
                        });
                        const wk = await Promise.all(days.map(({ from, to }) =>
                            safe(axiosInstance.get(EP.milkSummary +
                                `?from=${from.toISOString()}&to=${to.toISOString()}`).then(r => r.data
                                .totalLiters || 0), 0)
                        ));
                        setWeeklyMilk(wk);
                        setDailyMilk(wk.length ? wk[wk.length - 1].toLocaleString('en-US') : '0');
                        setAlerts([]);
                        setIsReal(true);
                    } catch (e) {
                        showToast('تعذر تحميل بعض البيانات: ' + errMsg(e), true);
                        setVaccines([]);
                        setVaccinations([]);
                        setHealthLogs([]);
                        setCattleList([]);
                        setCattleOpts([]);
                        setCattleTotal(0);
                        setStaffList([]);
                        setTopProducers([]);
                        setWeeklyMilk([]);
                        setDailyMilk('—');
                        setAlerts([]);
                        setIsReal(true);
                        setLoadError(true);
                    } finally { setLoading(false); }
                } else {
                    // demo mode
                    setVaccines(MOCK.vaccines);
                    setVaccinations(MOCK.vaccinations);
                    setHealthLogs(MOCK.healthLogs);
                    setCattleOpts(MOCK.cattle.map(c => ({ id: c.id, tagNumber: c.tagNumber })));
                    setCattleList(MOCK.cattle);
                    setCattleTotal(MOCK.cattle.length);
                    setStaffList(MOCK.staff);
                    setTopProducers(MOCK.topProducers);
                    setWeeklyMilk(MOCK.weeklyMilk);
                    setDailyMilk('1,840');
                    setAlerts(MOCK.alerts);
                    setIsReal(false);
                    setLoadError(false);
                    setLoading(false);
                }
            }, []);

            // ── init ──
            useEffect(() => {
                if (isLoggedIn()) {
                    const t = getToken();
                    const stored = localStorage.getItem('hs_role');
                    let dec = null;
                    try { dec = decodeToken(t); } catch (e) {}
                    let role = stored || 'Guest',
                        name = localStorage.getItem('hs_name') || 'مستخدم';
                    if (dec && dec.primaryRole && dec.primaryRole !== 'Guest') {
                        role = dec.primaryRole;
                        name = dec.name || name;
                    }
                    setCurrentRole(role);
                    setUser({ name, roles: dec ? dec.roles : [role] });
                } else {
                    setCurrentRole('Guest');
                    setDemoRole('Owner');
                    setUser({ name: 'ضيف', roles: ['Guest'] });
                }
                loadData();
            }, []);

            const handleRoleChange = e => {
                if (isLoggedIn()) return;
                const nr = e.target.value;
                setDemoRole(nr);
                showToast(`تم التبديل إلى دور: ${roleNames[nr]}`);
            };

            const ctx = {
                user,
                currentRole: effectiveRole,
                realRole: currentRole,
                demoRole,
                hasPermission,
                loading,
                vaccines,
                setVaccines,
                vaccinations,
                setVaccinations,
                healthLogs,
                setHealthLogs,
                cattleOpts,
                cattleList,
                setCattleList,
                cattleTotal,
                staffList,
                setStaffList,
                weeklyMilk,
                topProducers,
                dailyMilk,
                alerts,
                setAlerts,
                showVaccineForm,
                setShowVaccineForm,
                showVaccinationForm,
                setShowVaccinationForm,
                showHealthForm,
                setShowHealthForm,
                showCattleForm,
                setShowCattleForm,
                loadData,
                handleRoleChange,
                logout: performLogout,
                isReal,
                loadError
            };

            return (
                <AuthProvider value={ctx}>
                    <div className="app">
                        <Topbar />
                        <div className="app-body">
                            <Sidebar activeView={activeView} setActiveView={setActiveView} />
                            <main className="content">
                                {activeView === 'dashboard' && <Dashboard setActiveView={setActiveView} />}
                                {activeView === 'cattle' && <CattleManagement />}
                                {activeView === 'health' && <HealthManagement />}
                                {activeView === 'staff' && <StaffManagement />}
                                {activeView === 'alerts' && <AlertsPage />}
                            </main>
                        </div>
                    </div>
                </AuthProvider>
            );
        }

            { icon: '💉', title: 'اللقاحات والتطعيمات', desc: 'جدولة وتتبع' },

            { icon: '📡', title: 'تنبيهات لحظية', desc: 'إشعارات فورية' },

                useAuth();

                        <div className="stat-card" style={{ cursor: 'pointer' }} onClick={() => setActiveView('alerts')}>

                    <div className="panel-grid">
                        <div className="card-box">

                            ) : (
                                <>
                                    <div style={{ fontSize: '.85rem', fontWeight: 700, color: 'var(--green-deep)',
                                            padding: '3px 0' }}>إجمالي: {totalWk.toLocaleString()} لتر</div>
                                    <div style={{ fontSize: '.6rem', color: 'var(--ink-soft)' }}>المعدل اليومي: {avg} لتر
                                    </div>

                                            height: '35px' }}>

                                            return <div key={i} style={{ flex: 1, display: 'flex',

                                                            background: 'var(--green)', borderRadius: '2px 2px 0 0',

                                                        marginTop: 1 }}>يوم</span>
                                                </div>;
                                        })}
                                    </div>
                                </>
                            )}
                        </div>

                        <div className="card-box">
                            <h4>📡 المستشعرات {!isReal && <span className="live-badge"><span className="live-dot"></span>
                                    عرض</span>}</h4>
                            {isReal ? (

                                        توجد أجهزة</div><div className="es-sub">اربط المستشعرات</div></div>
                            ) : (

        // ─── CattleManagement ───
        function CattleManagement() {
            const { hasPermission, loading, cattleList, setCattleList, cattleTotal, showCattleForm, setShowCattleForm,
                loadData, isReal } = useAuth();
            const empty = { tagNumber: '', breed: '', gender: 0, birthDate: '', fatherTagNumber: '', motherTagNumber: '' };
            const [form, setForm] = useState(empty);
            const [errors, setErrors] = useState({});
            const [search, setSearch] = useState('');
            const [statusFilter, setStatusFilter] = useState('all');
            const [savingId, setSavingId] = useState(null);
            const [deletingId, setDeletingId] = useState(null);

            const validate = () => {
                const e = {};
                if (!form.tagNumber.trim()) e.tagNumber = 'رقم التاج مطلوب';
                if (!form.breed.trim()) e.breed = 'السلالة مطلوبة';
                if (!form.birthDate) e.birthDate = 'الميلاد مطلوب';
                else if (new Date(form.birthDate) > new Date()) e.birthDate = 'لا يمكن أن يكون في المستقبل';
                setErrors(e);
                return Object.keys(e).length === 0;
            };

            const handleAdd = async e => {
                e.preventDefault();
                if (!hasPermission('create_cattle')) { showToast('⚠️ ليس لديك صلاحية', true); return; }
                if (!validate()) return;
                try {
                    const payload = {
                        tagNumber: form.tagNumber.trim(),
                        breed: form.breed.trim(),
                        gender: Number(form.gender),
                        birthDate: new Date(form.birthDate).toISOString(),
                        fatherTagNumber: form.fatherTagNumber.trim() || null,
                        motherTagNumber: form.motherTagNumber.trim() || null
                    };
                    const r = await axiosInstance.post(EP.cattle, payload);
                    setCattleList([r.data, ...cattleList]);
                    setShowCattleForm(false);
                    setForm(empty);
                    showToast('✅ تم تسجيل رأس الماشية');
                    loadData();
                } catch (err) { showToast('فشل الإضافة: ' + errMsg(err), true); }
            };

            const handleStatus = async (cattle, newStatus) => {
                if (!hasPermission('edit_cattle')) { showToast('⚠️ ليس لديك صلاحية', true); return; }
                setSavingId(cattle.id);
                try {
                    await axiosInstance.put(EP.cattleStatus(cattle.id), { id: cattle.id, newStatus: Number(newStatus) });
                    setCattleList(cattleList.map(c => c.id === cattle.id ? { ...c, status: Number(newStatus) } : c));
                    showToast('✅ تم تحديث الحالة');
                } catch (err) { showToast('فشل تحديث الحالة: ' + errMsg(err), true); } finally { setSavingId(null); }
            };

            const handleDelete = async cattle => {
                if (!hasPermission('delete_cattle')) { showToast('⚠️ الحذف لمالك المزرعة فقط', true); return; }
                if (!window.confirm(`حذف ${cattle.tagNumber}؟`)) return;
                setDeletingId(cattle.id);
                try {
                    await axiosInstance.delete(EP.cattleOne(cattle.id));
                    setCattleList(cattleList.filter(c => c.id !== cattle.id));
                    showToast('✅ تم الحذف');
                    loadData();
                } catch (err) { showToast('فشل الحذف: ' + errMsg(err), true); } finally { setDeletingId(null); }
            };

            const filtered = cattleList.filter(c => {
                const m = !search || c.tagNumber?.toLowerCase().includes(search.toLowerCase()) ||
                    c.breed?.toLowerCase().includes(search.toLowerCase());
                const s = statusFilter === 'all' || String(c.status) === statusFilter;
                return m && s;
            });

            const ageLabel = bd => {
                if (!bd) return '—';
                const m = Math.max(0, Math.floor((Date.now() - new Date(bd)) / (1000 * 60 * 60 * 24 * 30.44)));
                return m < 12 ? m + ' شهر' : Math.floor(m / 12) + ' سنة و ' + (m % 12) + ' شهر';
            };

            if (loading) return <div className="loading-box"><span className="spinner"></span>جاري التحميل...</div>;

            return (
                <div>
                    <div className="view-head">
                        <div><h1>🐮 إدارة الماشية</h1><p>{cattleTotal} رأس {isReal ? '' : '(تجريبي)'}</p></div>
                        <ActionButton allowed={hasPermission('create_cattle')} reason="للمالك والبيطري" className="btn-solid"
                            onClick={() => setShowCattleForm(true)}>+ تسجيل</ActionButton>
                    </div>

                    {showCattleForm && hasPermission('create_cattle') && (
                        <div className="card-box">
                            <h4>تسجيل رأس ماشية</h4>
                            <form onSubmit={handleAdd}>
                                <div className="form-grid-3">
                                    <div className="field"><label>رقم التاج *</label><input type="text" value={form
                                            .tagNumber} onChange={e => setForm({ ...form, tagNumber: e.target
                                            .value })} placeholder="A501" />{errors.tagNumber && <span
                                            className="field-error">{errors.tagNumber}</span>}</div>
                                    <div className="field"><label>السلالة *</label><input type="text" value={form.breed}
                                            onChange={e => setForm({ ...form, breed: e.target.value })}
                                            placeholder="هولشتاين" />{errors.breed && <span
                                            className="field-error">{errors.breed}</span>}</div>
                                    <div className="field"><label>الجنس *</label><select value={form.gender} onChange={e =>
                                            setForm({ ...form, gender: e.target.value })}><option value={0}>ذكر</option><option
                                                value={1}>أنثى</option></select></div>
                                    <div className="field"><label>الميلاد *</label><input type="date" value={form
                                            .birthDate} onChange={e => setForm({ ...form, birthDate: e.target
                                            .value })} />{errors.birthDate && <span
                                            className="field-error">{errors.birthDate}</span>}</div>
                                    <div className="field"><label>الأب (اختياري)</label><input type="text" value={form
                                            .fatherTagNumber} onChange={e => setForm({ ...form, fatherTagNumber: e
                                            .target.value })} /></div>
                                    <div className="field"><label>الأم (اختياري)</label><input type="text" value={form
                                            .motherTagNumber} onChange={e => setForm({ ...form, motherTagNumber: e
                                            .target.value })} /></div>
                                </div>
                                <div className="modal-actions">
                                    <button type="submit" className="btn btn-solid">حفظ</button>
                                    <button type="button" className="btn btn-outline" onClick={() => { setShowCattleForm(
                                            false);
                                        setForm(empty);
                                        setErrors({}) }}>إلغاء</button>
                                </div>
                            </form>
                        </div>
                    )}

                    <div className="card-box">
                        <h4>القطيع <span style={{ display: 'flex', gap: '4px', flexWrap: 'wrap' }}>
                                <input type="text" placeholder="بحث..." value={search} onChange={e => setSearch(e.target
                                        .value)} style={{ padding: '2px 5px', borderRadius: '5px',
                                    border: '1px solid var(--line)', fontSize: '.6rem', minWidth: '100px' }} />
                                <select value={statusFilter} onChange={e => setStatusFilter(e.target.value)} style={{
                                        padding: '2px 5px', borderRadius: '5px', border: '1px solid var(--line)',
                                        fontSize: '.6rem' }}>
                                    <option value="all">الكل</option>
                                    {Object.entries(CATTLE_STATUS_MAP).map(([k, v]) => <option key={k} value={k}>{v
                                            .label}</option>)}
                                </select>
                            </span></h4>
                        <div className="table-scroll">
                            <table>
                                <thead><tr><th>التاج</th><th>السلالة</th><th>الجنس</th><th>العمر</th><th>الحالة</th><th>إجراء</th></tr></thead>
                                <tbody>
                                    {filtered.length === 0 ? (
                                        <tr><td colSpan="6"><div className="empty-state"><div className="es-ic">🐄</div><div
                                                    className="es-title">لا توجد نتائج</div></div></td></tr>
                                    ) : (
                                        filtered.map(c => (
                                            <tr key={c.id}>
                                                <td><strong>{c.tagNumber}</strong></td>
                                                <td>{c.breed}</td>
                                                <td><span className="gender-ic">{GENDER_MAP[c.gender]?.icon}</span> {GENDER_MAP[
                                                        c.gender]?.label || '—'}</td>
                                                <td>{ageLabel(c.birthDate)}</td>
                                                <td>{hasPermission('edit_cattle') ? (

        // ─── HealthManagement ───
        function HealthManagement() {
            const { currentRole, hasPermission, loading, vaccines, setVaccines, vaccinations, setVaccinations, healthLogs,

            const [vf, setVf] = useState({ name: '', targetAgeInMonths: '', dosage: '', intervalInDays: '' });
            const [ve, setVe] = useState({});
            const [vaccF, setVaccF] = useState({ cattleId: '', vaccineId: '', scheduledDate: '' });
            const [vaccE, setVaccE] = useState({});
            const [hf, setHf] = useState({ cattleId: '', diagnosis: '', treatmentPlan: '', vetNotes: '',
            isContagious: false });
            const [he, setHe] = useState({});
            const [subHealth, setSubHealth] = useState(false);

            const opts = vaccines.map(v => ({ id: v.id, name: v.name }));

            // ── استخدام hasPermission بدلاً من المقارنة المباشرة ──
            const canCreateVaccine = hasPermission('create_vaccine');
            const canEditHealth = hasPermission('edit_health');

            const validateVaccine = () => {
                const e = {};
                if (!vf.name.trim()) e.name = 'اسم اللقاح مطلوب';
                const age = Number(vf.targetAgeInMonths);
                if (isNaN(age) || age < 0) e.targetAgeInMonths = '0 أو أكبر';
                const dose = Number(vf.dosage);
                if (isNaN(dose) || dose < 0) e.dosage = '0 أو أكبر';
                if (vf.intervalInDays && Number(vf.intervalInDays) < 0) e.intervalInDays = '0 أو أكبر';
                setVe(e);
                return Object.keys(e).length === 0;
            };

            const validateVaccination = () => {
                const e = {};
                if (!vaccF.cattleId) e.cattleId = 'اختر بقرة';
                if (!vaccF.vaccineId) e.vaccineId = 'اختر لقاح';
                if (!vaccF.scheduledDate) e.scheduledDate = 'حدد التاريخ';
                setVaccE(e);
                return Object.keys(e).length === 0;
            };

            const validateHealth = () => {
                const e = {};
                if (!hf.cattleId) e.cattleId = 'اختر بقرة';
                if (!hf.diagnosis.trim()) e.diagnosis = 'التشخيص مطلوب';
                if (!hf.treatmentPlan.trim()) e.treatmentPlan = 'خطة العلاج مطلوبة';
                setHe(e);
                return Object.keys(e).length === 0;
            };

            const handleAddVaccine = async e => {
                e.preventDefault();
                if (!canCreateVaccine) { showToast('⚠️ للبيطري فقط', true); return; }
                if (!validateVaccine()) return;
                try {
                    const payload = {
                        name: vf.name,
                        targetAgeInMonths: Number(vf.targetAgeInMonths),
                        dosage: Number(vf.dosage),
                        intervalInDays: vf.intervalInDays ? Number(vf.intervalInDays) : null
                    };
                    const r = await axiosInstance.post(EP.vaccines, payload);
                    setVaccines([...vaccines, r.data]);
                    setShowVaccineForm(false);
                    setVf({ name: '', targetAgeInMonths: '', dosage: '', intervalInDays: '' });
                    showToast('✅ تم إضافة اللقاح');
                    loadData();
                } catch (err) { showToast('فشل الإضافة: ' + errMsg(err), true); }
            };

            const handleAddVaccination = async e => {
                e.preventDefault();
                if (!hasPermission('schedule_vaccination')) { showToast('⚠️ للمالك والبيطري', true); return; }
                if (!validateVaccination()) return;
                try {
                    const payload = {
                        cattleId: vaccF.cattleId,
                        vaccineId: vaccF.vaccineId,
                        scheduledDate: new Date(vaccF.scheduledDate).toISOString()
                    };
                    const r = await axiosInstance.post(EP.vaccinations, payload);
                    setVaccinations([...vaccinations, r.data]);
                    setShowVaccinationForm(false);
                    setVaccF({ cattleId: '', vaccineId: '', scheduledDate: '' });
                    showToast('✅ تمت الجدولة');
                    loadData();
                } catch (err) { showToast('فشل الجدولة: ' + errMsg(err), true); }
            };

            const handleAdminister = async id => {
                if (!hasPermission('administer_vaccination')) { showToast('⚠️ للبيطري فقط', true); return; }
                try {
                    await axiosInstance.post(EP.vaccAdminister(id), new Date().toISOString());
                    showToast('✅ تم الإعطاء');
                    loadData();
                } catch (err) { showToast('فشل الإعطاء: ' + errMsg(err), true); }
            };

            const handleAddHealth = async e => {
                e.preventDefault();
                if (subHealth) return;
                if (!hasPermission('create_health')) { showToast('⚠️ للبيطري فقط', true); return; }
                if (!validateHealth()) return;
                setSubHealth(true);
                try {
                    const payload = {
                        cattleId: hf.cattleId,
                        diagnosis: hf.diagnosis,
                        treatmentPlan: hf.treatmentPlan,
                        vetNotes: hf.vetNotes || null,
                        isContagious: hf.isContagious

                    setHealthLogs([...healthLogs, r.data]);
                    setShowHealthForm(false);
                    setHf({ cattleId: '', diagnosis: '', treatmentPlan: '', vetNotes: '', isContagious: false });
                    showToast('✅ تم إضافة السجل');
                    loadData();

                                    <div className="form-grid-2">
                                        <div className="field"><label>الاسم *</label><input type="text" value={vf.name}
                                                onChange={e => setVf({ ...vf, name: e.target.value })} />{ve.name && <span
                                                    className="field-error">{ve.name}</span>}</div>
                                        <div className="field"><label>العمر (شهر) *</label><input type="number" value={vf
                                                .targetAgeInMonths} onChange={e => setVf({ ...vf, targetAgeInMonths: e
                                                    .target.value })} min="0" />{ve.targetAgeInMonths && <span
                                                    className="field-error">{ve.targetAgeInMonths}</span>}</div>
                                        <div className="field"><label>الجرعة *</label><input type="number" value={vf.dosage}
                                                onChange={e => setVf({ ...vf, dosage: e.target.value })} min="0"
                                                step="0.1" />{ve.dosage && <span className="field-error">{ve
                                                .dosage}</span>}</div>
                                        <div className="field"><label>الفاصل (يوم)</label><input type="number" value={vf
                                                .intervalInDays} onChange={e => setVf({ ...vf, intervalInDays: e.target
                                                    .value })} min="0" />{ve.intervalInDays && <span
                                                    className="field-error">{ve.intervalInDays}</span>}</div>
                                    </div>
                                    <div className="modal-actions">
                                        <button type="submit" className="btn btn-solid">حفظ</button>
                                        <button type="button" className="btn btn-outline" onClick={() =>
                                            setShowVaccineForm(false)}>إلغاء</button>
                                    </div>
                                </form>
                            </div>
                        )}
                        <div className="table-scroll">
                            <table>
                                <thead><tr><th>الاسم</th><th>العمر</th><th>الجرعة</th><th>الفاصل</th></tr></thead>
                                <tbody>

                                        <tr><td colSpan="4" className="empty-row">لا توجد لقاحات</td></tr>

                    {/* ─── التطعيمات ─── */}

                                className="btn-solid" onClick={() => setShowVaccinationForm(true)}>+ جدولة</ActionButton></h4>
                        {showVaccinationForm && hasPermission('schedule_vaccination') && (

                                <form onSubmit={handleAddVaccination}>
                                    <div className="form-grid-3">

                                                onChange={e => setVaccF({ ...vaccF, cattleId: e.target.value })}>
                                                <option value="">اختر</option>
                                                {cattleOpts.map(c => <option key={c.id} value={c.id}>{c
                                                    .tagNumber}</option>)}
                                            </select>{vaccE.cattleId && <span className="field-error">{vaccE
                                                .cattleId}</span>}</div>
                                        <div className="field"><label>اللقاح *</label><select value={vaccF.vaccineId}
                                                onChange={e => setVaccF({ ...vaccF, vaccineId: e.target.value })}>
                                                <option value="">اختر</option>
                                                {opts.map(v => <option key={v.id} value={v.id}>{v.name}</option>)}
                                            </select>{vaccE.vaccineId && <span className="field-error">{vaccE
                                                .vaccineId}</span>}</div>
                                        <div className="field"><label>التاريخ *</label><input type="date" value={vaccF
                                                .scheduledDate} onChange={e => setVaccF({ ...vaccF, scheduledDate: e
                                                    .target.value })} />{vaccE.scheduledDate && <span
                                                    className="field-error">{vaccE.scheduledDate}</span>}</div>

                                    <div className="modal-actions">
                                        <button type="submit" className="btn btn-solid">حفظ</button>
                                        <button type="button" className="btn btn-outline" onClick={() =>
                                            setShowVaccinationForm(false)}>إلغاء</button>
                                    </div>
                                </form>
                            </div>
                        )}
                        <div className="table-scroll">
                            <table>
                                <thead><tr><th>البقرة</th><th>اللقاح</th><th>الموعد</th><th>الحالة</th><th>إجراء</th></tr></thead>
                                <tbody>

                                            <tr key={v.id}>

                                                <td><span className={`badge ${v.administeredDate ? 'ok' :

                    {/* ─── السجلات الصحية ─── */}
                    <div className="card-box">

                                className="btn-solid" onClick={() => setShowHealthForm(true)}>+ إضافة</ActionButton></h4>
                        {showHealthForm && hasPermission('create_health') && (

                                <form onSubmit={handleAddHealth}>
                                    <div className="form-grid-2">
                                        <div className="field"><label>البقرة *</label><select value={hf.cattleId}
                                                onChange={e => setHf({ ...hf, cattleId: e.target.value })}>
                                                <option value="">اختر</option>
                                                {cattleOpts.map(c => <option key={c.id} value={c.id}>{c
                                                    .tagNumber}</option>)}
                                            </select>{he.cattleId && <span className="field-error">{he
                                            .cattleId}</span>}</div>
                                        <div className="field"><label>التشخيص *</label><input type="text" value={hf
                                                .diagnosis} onChange={e => setHf({ ...hf, diagnosis: e.target
                                                .value })} />{he.diagnosis && <span
                                            className="field-error">{he.diagnosis}</span>}</div>
                                        <div className="field"><label>خطة العلاج *</label><input type="text" value={hf
                                                .treatmentPlan} onChange={e => setHf({ ...hf, treatmentPlan: e
                                                    .target.value })} />{he.treatmentPlan && <span
                                                    className="field-error">{he.treatmentPlan}</span>}</div>
                                        <div className="field"><label>ملاحظات</label><input type="text" value={hf
                                                .vetNotes} onChange={e => setHf({ ...hf, vetNotes: e.target
                                                .value })} /></div>
                                        <div className="field" style={{ display: 'flex', alignItems: 'center',
                                                gap: '4px' }}>

                                                        .target.checked })} /> معدية</label>

                        <div className="table-scroll">

        function StaffManagement() {

            const [showForm, setShowForm] = useState(false);
            const [formData, setFormData] = useState({ fullName: '', email: '', password: '', role: 'Vet' });
            const [errors, setErrors] = useState({});

                const e = {};
                if (!formData.fullName.trim()) e.fullName = 'الاسم مطلوب';
                if (!formData.email.trim()) e.email = 'البريد مطلوب';
                else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(formData.email)) e.email = 'صيغة البريد غير صحيحة';
                if (!formData.password || formData.password.length < 6) e.password = '6 أحرف على الأقل';

                return Object.keys(e).length === 0;

                    const payload = {
                        fullName: formData.fullName,
                        email: formData.email,
                        password: formData.password,
                        role: ROLE_STRING_TO_INT[formData.role]
                    };
                    const r = await axiosInstance.post(EP.users, payload);

                    setFormData({ fullName: '', email: '', password: '', role: 'Vet' });
                    showToast('✅ تم إضافة الموظف');

                return (

                <div>

                                            .value })} />{errors.fullName && <span
                                            className="field-error">{errors.fullName}</span>}</div>
                                    <div className="field"><label>البريد *</label><input type="email" value={formData
                                            .email} onChange={e => setFormData({ ...formData, email: e.target
                                            .value })} />{errors.email && <span
                                            className="field-error">{errors.email}</span>}</div>

                                            .password} onChange={e => setFormData({ ...formData, password: e.target
                                            .value })} />{errors.password && <span
                                            className="field-error">{errors.password}</span>}</div>
                                    <div className="field"><label>الدور</label><select value={formData.role} onChange={e =>
