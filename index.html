// ===== AXIOS =====
const axiosInstance = axios.create({ baseURL: API_BASE, headers: { 'Content-Type': 'application/json' } });
axiosInstance.interceptors.request.use(c => {
  const t = localStorage.getItem('hs_token');
  if (t) c.headers.Authorization = 'Bearer ' + t;
  return c;
});

let isRefreshing = false, failedQueue = [];
const processQueue = (e, t = null) => {
  failedQueue.forEach(p => { if (e) p.reject(e); else p.resolve(t); });
  failedQueue = [];
};

axiosInstance.interceptors.response.use(
  r => r,
  async e => {
    const o = e.config;
    if (e.response?.status === 401 && !o._retry) {
      if (isRefreshing) {
        return new Promise((resolve, reject) => {
          failedQueue.push({ resolve, reject });
        }).then(t => {
          o.headers.Authorization = 'Bearer ' + t;
          return axiosInstance(o);
        }).catch(err => Promise.reject(err));
      }
      o._retry = true;
      isRefreshing = true;
      const rt = localStorage.getItem('hs_refreshToken');
      if (!rt) { isRefreshing = false; window.logout(); return Promise.reject(e); }
      try {
        const res = await axios.post(API_BASE + EP.refresh, {
          refreshToken: rt,
          accessToken: localStorage.getItem('hs_token')
        });
        const nt = res.data.accessToken;
        localStorage.setItem('hs_token', nt);
        if (res.data.refreshToken) localStorage.setItem('hs_refreshToken', res.data.refreshToken);
        processQueue(null, nt);
        o.headers.Authorization = 'Bearer ' + nt;
        return axiosInstance(o);
      } catch (er) {
        processQueue(er, null);
        window.logout();
        showToast('انتهت الجلسة، يرجى تسجيل الدخول مجدداً', true);
        return Promise.reject(er);
      } finally {
        isRefreshing = false;
      }
    }
    if (e.response?.status === 401) window.logout();
    return Promise.reject(e);
  }
);

// ===== HELPERS =====
function showToast(msg, isError = false) {
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast' + (isError ? ' error' : '');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

function extractValidationErrors(err) {
  const d = err.response?.data;
  if (!d) return [];
  let msgs = [];
  if (d.errors && typeof d.errors === 'object') {
    Object.values(d.errors).forEach(arr => { if (Array.isArray(arr)) msgs.push(...arr); });
  } else if (Array.isArray(d.errors)) msgs.push(...d.errors);
  else if (d.message) msgs.push(d.message);
  else if (d.title) msgs.push(d.title);
  else if (typeof d === 'string') msgs.push(d);
  return msgs;
}

const ERROR_TRANSLATIONS = [
  { test: /invalid\s*(email|username)?\s*(or|\/)\s*password|incorrect/i, ar: 'البريد الإلكتروني أو كلمة المرور غير صحيحة' },
  { test: /user\s*not\s*found|account\s*not\s*found/i, ar: 'لا يوجد حساب مسجّل بهذا البريد الإلكتروني' },
  { test: /already\s*(exists|registered|taken|in\s*use)/i, ar: 'هذا البريد الإلكتروني مستخدم بالفعل' },
  { test: /unauthorized/i, ar: 'بيانات الدخول غير صحيحة أو انتهت صلاحية الجلسة' },
  { test: /forbidden|not\s*allowed|permission\s*denied/i, ar: 'ليس لديك صلاحية لتنفيذ هذا الإجراء' },
  { test: /not\s*found/i, ar: 'العنصر المطلوب غير موجود' },
  { test: /already\s*administered/i, ar: 'تم إعطاء هذا اللقاح بالفعل' },
  { test: /conflict|duplicate/i, ar: 'هذه البيانات مسجّلة بالفعل' },
  { test: /network\s*error/i, ar: 'تعذر الاتصال بالخادم، تحقق من اتصال الإنترنت' },
  { test: /is\s*required|cannot\s*be\s*empty|field\s*is\s*required/i, ar: 'هناك حقل مطلوب لم يتم إدخاله' },
  { test: /invalid\s*email/i, ar: 'صيغة البريد الإلكتروني غير صحيحة' },
  { test: /password.*(short|weak|length|characters)/i, ar: 'كلمة المرور لا تحقق الشروط المطلوبة' },
  { test: /future\s*date|cannot\s*be\s*in\s*the\s*future/i, ar: 'التاريخ لا يمكن أن يكون في المستقبل' },
  { test: /token\s*expired|expired\s*token/i, ar: 'انتهت صلاحية الجلسة، يرجى تسجيل الدخول من جديد' },
  { test: /server\s*error|internal\s*server/i, ar: 'حدث خطأ في الخادم، حاول مرة أخرى لاحقاً' },
  { test: /rate\s*limit|too\s*many\s*requests/i, ar: 'عدد كبير من المحاولات، حاول مرة أخرى بعد قليل' }
];

function translateErrorMessage(raw) {
  if (!raw || typeof raw !== 'string') return null;
  for (const item of ERROR_TRANSLATIONS) {
    if (item.test.test(raw)) return item.ar;
  }
  if (/[\u0600-\u06FF]/.test(raw)) return raw;
  return null;
}

function statusFallbackMessage(status) {
  switch (status) {
    case 400: return 'البيانات المُدخلة غير صحيحة، يرجى مراجعتها والمحاولة مرة أخرى';
    case 401: return 'البريد الإلكتروني أو كلمة المرور غير صحيحة';
    case 403: return 'ليس لديك صلاحية لتنفيذ هذا الإجراء';
    case 404: return 'العنصر المطلوب غير موجود';
    case 409: return 'هذه البيانات مسجّلة بالفعل';
    case 422: return 'تحقق من صحة البيانات المدخلة';
    case 429: return 'عدد كبير من المحاولات، حاول مرة أخرى بعد قليل';
    case 500: return 'حدث خطأ في الخادم، حاول مرة أخرى لاحقاً';
    default: return null;
  }
}

function errMsg(err, fallback = 'حدث خطأ غير متوقع، حاول مرة أخرى') {
  if (!err || !err.response) return 'تعذر الاتصال بالخادم، تحقق من اتصال الإنترنت';
  const status = err.response.status;
  const raw = extractValidationErrors(err);
  const translated = raw.map(translateErrorMessage).filter(Boolean);
  if (translated.length) return [...new Set(translated)].join(' | ');
  return statusFallbackMessage(status) || fallback;
}

function getToken() { return localStorage.getItem('hs_token'); }
function isLoggedIn() { return !!getToken(); }
function clearSession() { ['hs_token', 'hs_refreshToken', 'hs_role', 'hs_name'].forEach(k => localStorage.removeItem(k)); }
function logout() { clearSession(); window.location.reload(); }
function persistSession(d) {
  localStorage.setItem('hs_token', d.accessToken);
  localStorage.setItem('hs_refreshToken', d.refreshToken);
  localStorage.setItem('hs_role', d.role || 'Owner');
  localStorage.setItem('hs_name', d.fullName || 'مستخدم');
}

function decodeToken(token) {
  try {
    const d = jwtDecode(token);
    let roles = [];
    const claims = ['role', 'roles',
      'http://schemas.microsoft.com/ws/2008/06/identity/claims/role',
      'http://schemas.microsoft.com/ws/2008/06/identity/claims/roles',
      'http://schemas.xmlsoap.org/ws/2005/05/identity/claims/role',
      'http://schemas.xmlsoap.org/ws/2005/05/identity/claims/roles'
    ];
    for (const c of claims) {
      if (d[c] !== undefined && d[c] !== null) {
        const v = d[c];
        if (Array.isArray(v) && v.length) { roles = v; break; }
        else if (typeof v === 'string' || typeof v === 'number') { roles = [v]; break; }
      }
    }
    if (!roles.length && d.role !== undefined && d.role !== null) roles = Array.isArray(d.role) ? d.role : [d.role];
    if (!roles.length && d.roles !== undefined && d.roles !== null) roles = Array.isArray(d.roles) ? d.roles : [d.roles];
    roles = roles.map(r => {
      if (typeof r === 'number') return ROLE_INT_MAP[r] || r;
      if (typeof r === 'string') {
        const n = Number(r);
        if (!isNaN(n) && n in ROLE_INT_MAP) return ROLE_INT_MAP[n];
        if (r in roleNames) return r;
        const l = r.toLowerCase();
        for (const [key, val] of Object.entries(ROLE_INT_MAP)) {
          if (val.toLowerCase() === l) return val;
        }
        return r;
      }
      return r;
    });
    roles = roles.filter(r => r && r !== 'null' && r !== 'undefined');
    const name = d['http://schemas.xmlsoap.org/ws/2005/05/identity/claims/name'] ||
      d['http://schemas.microsoft.com/ws/2008/06/identity/claims/name'] ||
      d.name || d.unique_name || 'مستخدم';
    return { roles: roles.length ? roles : ['Guest'], name: name || 'مستخدم' };
  } catch (e) {
    return { roles: ['Guest'], name: 'ضيف' };
  }
}

// ===== APP =====
function App() {
  const [user, setUser] = useState(null);
  const [activeView, setActiveView] = useState('dashboard');
  const [loading, setLoading] = useState(false);
  const [currentRole, setCurrentRole] = useState('Guest');
  const [isRealData, setIsRealData] = useState(false);
  const [userName, setUserName] = useState('');
  const [sidebarOpen, setSidebarOpen] = useState(false);

  const [vaccines, setVaccines] = useState([]);
  const [vaccinations, setVaccinations] = useState([]);
  const [healthLogs, setHealthLogs] = useState([]);
  const [cattleOptions, setCattleOptions] = useState([]);
  const [cattleList, setCattleList] = useState([]);
  const [cattleTotal, setCattleTotal] = useState(0);
  const [staffList, setStaffList] = useState([]);
  const [weeklyMilk, setWeeklyMilk] = useState([]);
  const [topProducers, setTopProducers] = useState([]);
  const [alerts, setAlerts] = useState([]);
  const [dailyMilk, setDailyMilk] = useState('—');

  const [showVaccineForm, setShowVaccineForm] = useState(false);
  const [showVaccinationForm, setShowVaccinationForm] = useState(false);
  const [showHealthForm, setShowHealthForm] = useState(false);
  const [showCattleForm, setShowCattleForm] = useState(false);

  const normalizedRole = useMemo(() => {
    if (typeof currentRole === 'number') return ROLE_INT_MAP[currentRole] || 'Guest';
    return currentRole || 'Guest';
  }, [currentRole]);

  const permissions = useMemo(() => ROLES_DEF[normalizedRole] || ROLES_DEF.Guest || ['view'], [normalizedRole]);
  const hasPermission = useCallback(a => permissions.includes(a), [permissions]);
  const isOwner = normalizedRole === STAFF_MANAGER_ROLE;

  const loadData = useCallback(async () => {
    if (isLoggedIn()) {
      setLoading(true);
      const safe = (p, f) => p.catch(() => f);
      try {
        const [vacs, vaccs, logs, cattleRes, staff, top] = await Promise.all([
          safe(axiosInstance.get(EP.vaccines + '?Page=1&PageSize=100').then(r => r.data.items || []), []),
          safe(axiosInstance.get(EP.vaccinations + '?Page=1&PageSize=100').then(r => r.data.items || []), []),
          safe(axiosInstance.get(EP.healthLogs + '?Page=1&PageSize=100').then(r => r.data.items || []), []),
          safe(axiosInstance.get(EP.cattle + '?Page=1&PageSize=100').then(r => r.data), { items: [], totalCount: 0 }),
          safe(axiosInstance.get(EP.users + '?Page=1&PageSize=100').then(r => r.data.items || []), []),
          safe(axiosInstance.get(EP.milkTop + '?Top=5').then(r => r.data || []), [])
        ]);
        setVaccines(vacs);
        setVaccinations(vaccs);
        setHealthLogs(logs);
        const cItems = cattleRes.items || [];
        setCattleList(cItems);
        setCattleOptions(cItems.map(c => ({ id: c.id, tagNumber: c.tagNumber })));
        setCattleTotal(cattleRes.totalCount ?? cItems.length);
        setStaffList(staff);
        setTopProducers(top);

        const days = Array.from({ length: 7 }, (_, i) => 6 - i).map(i => {
          const d = new Date(); d.setDate(d.getDate() - i);
          const f = new Date(d); f.setHours(0,0,0,0);
          const t = new Date(d); t.setHours(23,59,59,999);
          return { from: f, to: t };
        });
        const wk = await Promise.all(days.map(({ from, to }) =>
          safe(axiosInstance.get(EP.milkSummary + '?from=' + from.toISOString() + '&to=' + to.toISOString()).then(r => r.data.totalLiters || 0), 0)
        ));
        setWeeklyMilk(wk);
        setDailyMilk(wk.length ? wk[wk.length - 1].toLocaleString('en-US') : '0');
        setAlerts([]);
        setIsRealData(true);
      } catch (e) {
        showToast('تعذر تحميل بعض البيانات: ' + errMsg(e), true);
        setVaccines([]); setVaccinations([]); setHealthLogs([]);
        setCattleList([]); setCattleOptions([]); setCattleTotal(0);
        setStaffList([]); setTopProducers([]); setWeeklyMilk([]);
        setDailyMilk('—'); setAlerts([]);
        setIsRealData(true);
      } finally { setLoading(false); }
    } else {
      setVaccines(MOCK.vaccines);
      setVaccinations(MOCK.vaccinations);
      setHealthLogs(MOCK.healthLogs);
      setCattleOptions(MOCK.cattle.map(c => ({ id: c.id, tagNumber: c.tagNumber })));
      setCattleList(MOCK.cattle);
      setCattleTotal(MOCK.cattle.length);
      setStaffList(MOCK.staff);
      setTopProducers(MOCK.topProducers);
      setWeeklyMilk(MOCK.weeklyMilk);
      setDailyMilk('1,840');
      setAlerts(MOCK.alerts);
      setIsRealData(false);
      setLoading(false);
    }
  }, []);

  useEffect(() => {
    if (isLoggedIn()) {
      const token = getToken();
      const decoded = decodeToken(token);
      const roles = decoded.roles || ['Owner'];
      const primary = roles[0] || 'Owner';
      setCurrentRole(primary);
      setUserName(decoded.name || localStorage.getItem('hs_name') || 'مستخدم');
      setUser({ name: decoded.name || localStorage.getItem('hs_name') || 'مستخدم', roles });
      loadData();
    } else {
      setCurrentRole('Guest');
      setUserName('ضيف');
      setUser({ name: 'ضيف', roles: ['Guest'] });
      loadData();
    }
  }, []);

  // Re-read token on change
  useEffect(() => {
    if (isLoggedIn()) {
      const token = getToken();
      const decoded = decodeToken(token);
      const roles = decoded.roles || ['Owner'];
      const primary = roles[0] || 'Owner';
      if (primary !== currentRole) setCurrentRole(primary);
      const name = decoded.name || localStorage.getItem('hs_name') || 'مستخدم';
      if (name !== userName) setUserName(name);
    }
  }, [localStorage.getItem('hs_token')]);

  const handleRoleChange = (e) => {
    const nr = e.target.value;
    setCurrentRole(nr);
    showToast('تم التبديل إلى دور: ' + roleNames[nr]);
  };

  const toggleSidebar = () => setSidebarOpen(!sidebarOpen);
  const closeSidebar = () => setSidebarOpen(false);

  useEffect(() => {
    if (activeView === 'staff' && !isOwner) setActiveView('dashboard');
  }, [isOwner, activeView]);

  const contextValue = {
    user, userName, currentRole: normalizedRole, isOwner, hasPermission, loading,
    vaccines, setVaccines, vaccinations, setVaccinations, healthLogs, setHealthLogs,
    cattleOptions, cattleList, setCattleList, cattleTotal,
    staffList, setStaffList, weeklyMilk, topProducers, dailyMilk, alerts, setAlerts,
    showVaccineForm, setShowVaccineForm, showVaccinationForm, setShowVaccinationForm,
    showHealthForm, setShowHealthForm, showCattleForm, setShowCattleForm,
    loadData, handleRoleChange, logout, isRealData,
    sidebarOpen, toggleSidebar, closeSidebar
  };

  return (
    <AuthProvider value={contextValue}>
      <div className="app">
        <Topbar />
        <div className="app-body">
          <Sidebar activeView={activeView} setActiveView={setActiveView} />
          <main className="content">
            {activeView === 'dashboard' && <Dashboard setActiveView={setActiveView} />}
            {activeView === 'cattle' && <CattleManagement />}
            {activeView === 'health' && <HealthManagement />}
            {activeView === 'staff' && isOwner && <StaffManagement />}
            {activeView === 'alerts' && <AlertsPage />}
          </main>
        </div>
      </div>
    </AuthProvider>
  );
}

// ===== CONTEXT =====
const AuthContext = createContext(null);
function AuthProvider({ children, value }) {
  return <AuthContext.Provider value={value}>{children}</AuthContext.Provider>;
}
function useAuth() {
  const ctx = useContext(AuthContext);
  if (!ctx) throw new Error('useAuth must be used within AuthProvider');
  return ctx;
}

// ===== ACTION BUTTON =====
function ActionButton({ allowed, reason, onClick, children, className = '', small = true }) {
  if (allowed) {
    return <button type="button" className={'btn ' + (small ? 'btn-small' : '') + ' ' + className} onClick={onClick}>{children}</button>;
  }
  return (
    <span className="tip-wrap" tabIndex={0}>
      <button type="button" className={'btn ' + (small ? 'btn-small' : '') + ' locked'} disabled onClick={e => e.preventDefault()}>
        <span className="lock-ic">🔒</span>{children}
      </button>
      <span className="tip-bubble">{reason || 'لا تملك صلاحية هذا الإجراء'}</span>
    </span>
  );
}

function Dashboard({ setActiveView }) {
  const { cattleOptions, cattleTotal, topProducers, dailyMilk, weeklyMilk, alerts, isRealData, loading, currentRole } = useAuth();
  const totalCattle = isRealData ? (cattleTotal || 0) : (cattleOptions.length || 0);
  const activeAlerts = alerts.filter(a => a.active).length;
  const isGuest = currentRole === 'Guest' || !isLoggedIn();
  const [temp, setTemp] = useState(6.5);
  const [move, setMove] = useState(5.2);

  useEffect(() => {
    if (isRealData) return;
    const iv = setInterval(() => {
      setTemp(Math.max(1, Math.min(10, Math.round((5 + (Math.random() - 0.5) * 6) * 10) / 10)));
      setMove(Math.max(1, Math.min(10, Math.round((5 + (Math.random() - 0.5) * 6) * 10) / 10)));
    }, 4000);
    return () => clearInterval(iv);
  }, [isRealData]);

  const gaugeColor = (v) => v >= 9 ? '#A85234' : v >= 7 ? '#C79A45' : '#3C6B41';
  const totalWk = weeklyMilk.reduce((a, b) => a + b, 0) || 0;
  const avgWk = weeklyMilk.length ? Math.round(totalWk / weeklyMilk.length) : 0;

  if (loading) return <div className="loading-box"><span className="spinner"></span>جاري تحميل لوحة التحكم...</div>;

  return (
    <div>
      <div className="view-head">
        <div><h1>📊 لوحة التحكم</h1><p>نظرة عامة لحظية على المزرعة</p></div>
        <span className="live-badge"><span className="live-dot"></span>{isRealData ? 'بيانات حية من مزرعتك' : 'بيانات تجريبية للعرض فقط'}</span>
      </div>
      {isGuest && (
        <div className="feature-hero">
          <h2>🌾 هيردسمارت — نظام إدارة المزرعة الذكي</h2>
          <p>أنت الآن تتصفح نسخة تجريبية ببيانات وهمية. أنشئ حساب مزرعتك لتبدأ بإدخال بيانات ماشيتك الحقيقية وتتابع كل شيء أولاً بأول.</p>
          <div className="feature-grid">
            {[
              { icon: '🐮', title: 'إدارة الماشية', desc: 'سجل كامل لكل رأس: السلالة، النسب، الحالة الصحية' },
              { icon: '💉', title: 'اللقاحات والتطعيمات', desc: 'جدولة وتتبع تلقائي حسب عمر كل بقرة' },
              { icon: '🩺', title: 'السجلات الصحية', desc: 'تشخيص وخطط علاج موثقة لكل حالة' },
              { icon: '🥛', title: 'إنتاج الحليب', desc: 'تتبع يومي وأسبوعي وأعلى المنتجات' },
              { icon: '📡', title: 'تنبيهات لحظية', desc: 'إشعارات فورية عند خلل في المؤشرات الحيوية' },
              { icon: '👥', title: 'إدارة الموظفين', desc: 'صلاحيات دقيقة لكل دور داخل المزرعة' }
            ].map((f, i) => (
              <div key={i} className="feature-chip">
                <div className="fc-ic">{f.icon}</div>
                <div className="fc-title">{f.title}</div>
                <div className="fc-desc">{f.desc}</div>
              </div>
            ))}
          </div>
          <div className="modal-actions" style={{ marginTop: '14px', maxWidth: '220px' }}>
            <button className="btn btn-solid" style={{ background: '#fff', color: 'var(--green-deep)' }} onClick={() => window.openAuthModal()}>ابدأ الآن مجاناً</button>
          </div>
        </div>
      )}
      <div className="stat-row">
        <div className="stat-card" style={{ cursor: 'pointer' }} onClick={() => setActiveView && setActiveView('cattle')}>
          <div className="label">إجمالي الماشية</div>
          <div className="value num">{totalCattle}</div>
          <div className="sub">رأس</div>
        </div>
        <div className="stat-card">
          <div className="label">إنتاج اليوم</div>
          <div className="value num">{dailyMilk}</div>
          <div className="sub">لتر</div>
        </div>
        <div className="stat-card" style={{ cursor: 'pointer' }} onClick={() => setActiveView && setActiveView('alerts')}>
          <div className="label">التنبيهات النشطة</div>
          <div className="value num rust">{activeAlerts}</div>
          <div className="sub">مستشعرات</div>
        </div>
      </div>
      <div className="panel-grid">
        <div className="card-box">
          <h4>📈 إنتاج الأسبوع <span className="milk-drop">🥛</span></h4>
          {totalWk === 0 && weeklyMilk.every(v => v === 0) ? (
            <div className="empty-state"><div className="es-ic">🥛</div><div className="es-title">لا يوجد إنتاج حليب مسجّل بعد</div><div className="es-sub">ابدأ بتسجيل جلسات الحلب اليومية لتظهر هنا.</div></div>
          ) : (
            <>
              <div style={{ fontSize: '1rem', fontWeight: 700, color: 'var(--green-deep)', padding: '6px 0' }}>إجمالي: {totalWk.toLocaleString()} لتر</div>
              <div style={{ fontSize: '.8rem', color: 'var(--ink-soft)' }}>المعدل اليومي: {avgWk} لتر</div>
              <div style={{ marginTop: 10, display: 'flex', gap: '3px', alignItems: 'flex-end', height: '50px' }}>
                {weeklyMilk.map((v, i) => {
                  const h = Math.max(4, (v / (Math.max(...weeklyMilk, 100)) * 40));
                  return (
                    <div key={i} style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
                      <div style={{ width: '100%', height: h + 'px', background: 'var(--green)', borderRadius: '3px 3px 0 0', transition: 'height .5s cubic-bezier(.4,0,.2,1)' }}></div>
                      <span style={{ fontSize: '.55rem', color: 'var(--ink-soft)', marginTop: 2 }}>يوم</span>
                    </div>
                  );
                })}
              </div>
            </>
          )}
        </div>
        <div className="card-box">
          <h4>📡 المستشعرات {!isRealData && <span className="live-badge"><span className="live-dot"></span> عرض تجريبي</span>}</h4>
          {isRealData ? (
            <div className="empty-state"><div className="es-ic">📶</div><div className="es-title">لا توجد أجهزة استشعار مربوطة بعد</div><div className="es-sub">بمجرد ربط أجهزة استشعار المزرعة، ستظهر قراءات الحرارة والحركة هنا لحظياً.</div></div>
          ) : (
            <div className="gauge-grid">
              <div className="gauge"><div className="g-label">🌡️ الحرارة</div><div className="g-value num" style={{ color: gaugeColor(temp) }}>{temp.toFixed(1)}/10</div><div className="g-bar"><div className="g-fill" style={{ width: temp * 10 + '%', background: gaugeColor(temp) }}></div></div></div>
              <div className="gauge"><div className="g-label">🏃 الحركة</div><div className="g-value num" style={{ color: gaugeColor(move) }}>{move.toFixed(1)}/10</div><div className="g-bar"><div className="g-fill" style={{ width: move * 10 + '%', background: gaugeColor(move) }}></div></div></div>
            </div>
          )}
          <div style={{ marginTop: 12 }}>
            <h4 style={{ fontSize: '.85rem' }}>🏆 أعلى الإنتاج</h4>
            {topProducers.length === 0 ? <div className="empty-state"><div className="es-sub">لا توجد بيانات إنتاج كافية بعد</div></div> :
              topProducers.map((p, i) => (
                <div key={i} className="producer-row"><span>🐄 #{p.tagNumber}</span><span className="liters num">{Number(p.totalLiters).toFixed(1)} لتر</span></div>
              ))}
          </div>
        </div>
      </div>
      <div className="card-box">
        <h4>🔔 آخر التنبيهات</h4>
        {alerts.length === 0 ? (
          <div className="empty-state"><div className="es-ic">{isRealData ? '📡' : '🎉'}</div><div className="es-title">{isRealData ? 'لا توجد تنبيهات — لم يتم ربط مستشعرات بعد' : 'لا توجد تنبيهات نشطة حالياً'}</div></div>
        ) : alerts.slice(0, 3).map(a => (
          <div key={a.id} className="alert-item">
            <span className={'dot ' + (a.active ? 'red' : 'gray')}></span>
            <div className="body"><div><strong>{a.text}</strong></div><div className="meta">{a.time} · <span className={'badge ' + (a.active ? 'active' : 'ok')}>{a.active ? 'نشط' : 'تم الحل'}</span></div></div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ===== CATTLE MANAGEMENT =====
function CattleManagement() {
  const { hasPermission, loading, cattleList, setCattleList, cattleTotal, showCattleForm, setShowCattleForm, loadData, isRealData } = useAuth();
  const emptyForm = { tagNumber: '', breed: '', gender: 0, birthDate: '', fatherTagNumber: '', motherTagNumber: '' };
  const [form, setForm] = useState(emptyForm);
  const [errors, setErrors] = useState({});
  const [search, setSearch] = useState('');
  const [statusFilter, setStatusFilter] = useState('all');
  const [savingStatusId, setSavingStatusId] = useState(null);
  const [deletingId, setDeletingId] = useState(null);

  const validate = () => {
    const err = {};
    if (!form.tagNumber.trim()) err.tagNumber = 'رقم التاج مطلوب';
    if (!form.breed.trim()) err.breed = 'السلالة مطلوبة';
    if (!form.birthDate) err.birthDate = 'تاريخ الميلاد مطلوب';
    else if (new Date(form.birthDate) > new Date()) err.birthDate = 'تاريخ الميلاد لا يمكن أن يكون في المستقبل';
    setErrors(err);
    return Object.keys(err).length === 0;
  };

  const handleAdd = async (e) => {
    e.preventDefault();
    if (!hasPermission('create_cattle')) { showToast('⚠️ ليس لديك صلاحية لإضافة ماشية', true); return; }
    if (!validate()) return;
    try {
      const payload = {
        tagNumber: form.tagNumber.trim(),
        breed: form.breed.trim(),
        gender: Number(form.gender),
        birthDate: new Date(form.birthDate).toISOString(),
        fatherTagNumber: form.fatherTagNumber.trim() || null,
        motherTagNumber: form.motherTagNumber.trim() || null
      };
      const res = await axiosInstance.post(EP.cattle, payload);
      setCattleList([res.data, ...cattleList]);
      setShowCattleForm(false);
      setForm(emptyForm);
      showToast('✅ تم تسجيل رأس الماشية بنجاح');
      loadData();
    } catch (err) { showToast('فشل الإضافة: ' + errMsg(err), true); }
  };

  const handleStatusChange = async (cattle, newStatus) => {
    if (!hasPermission('edit_cattle')) { showToast('⚠️ ليس لديك صلاحية لتعديل حالة الماشية', true); return; }
    setSavingStatusId(cattle.id);
    try {
      await axiosInstance.put(EP.cattleStatus(cattle.id), { id: cattle.id, newStatus: Number(newStatus) });
      setCattleList(cattleList.map(c => c.id === cattle.id ? { ...c, status: Number(newStatus) } : c));
      showToast('✅ تم تحديث حالة الماشية');
    } catch (err) { showToast('فشل تحديث الحالة: ' + errMsg(err), true); }
    finally { setSavingStatusId(null); }
  };

  const handleDelete = async (cattle) => {
    if (!isRealData) { showToast('⚠️ لا يمكن حذف بيانات تجريبية', true); return; }
    if (!hasPermission('delete_cattle')) { showToast('⚠️ حذف الماشية متاح فقط لمالك المزرعة', true); return; }
    if (!window.confirm('هل أنت متأكد من حذف رأس الماشية رقم ' + cattle.tagNumber + '؟ لا يمكن التراجع عن هذا الإجراء.')) return;
    setDeletingId(cattle.id);
    try {
      await axiosInstance.delete(EP.cattleOne(cattle.id));
      setCattleList(cattleList.filter(c => c.id !== cattle.id));
      showToast('✅ تم حذف رأس الماشية');
      loadData();
    } catch (err) { showToast('فشل الحذف: ' + errMsg(err, 'حدث خطأ أثناء الحذف، تأكد من أن البقرة غير مرتبطة ببيانات أخرى'), true); }
    finally { setDeletingId(null); }
  };

  const filtered = cattleList.filter(c => {
    const m = !search || c.tagNumber?.toLowerCase().includes(search.toLowerCase()) || c.breed?.toLowerCase().includes(search.toLowerCase());
    const s = statusFilter === 'all' || String(c.status) === statusFilter;
    return m && s;
  });

  const ageLabel = (bd) => {
    if (!bd) return '—';
    const m = Math.max(0, Math.floor((Date.now() - new Date(bd)) / (1000 * 60 * 60 * 24 * 30.44)));
    return m < 12 ? m + ' شهر' : Math.floor(m / 12) + ' سنة و ' + (m % 12) + ' شهر';
  };

  if (loading) return <div className="loading-box"><span className="spinner"></span>جاري تحميل بيانات الماشية...</div>;

  return (
    <div>
      <div className="view-head">
        <div><h1>🐮 إدارة الماشية</h1><p>سجل كامل لقطيع المزرعة — {cattleTotal} رأس {isRealData ? '' : '(بيانات تجريبية)'}</p></div>
        <ActionButton allowed={hasPermission('create_cattle') && isRealData} reason="إضافة ماشية جديدة متاحة لمالك المزرعة والطبيب البيطري فقط" className="btn-solid" onClick={() => setShowCattleForm(true)}>+ تسجيل رأس ماشية</ActionButton>
      </div>
      {showCattleForm && hasPermission('create_cattle') && isRealData && (
        <div className="card-box">
          <h4>تسجيل رأس ماشية جديد</h4>
          <form onSubmit={handleAdd}>
            <div className="form-grid-3">
              <div className="field"><label>رقم التاج *</label><input type="text" value={form.tagNumber} onChange={e => setForm({ ...form, tagNumber: e.target.value })} placeholder="مثال: A501" />{errors.tagNumber && <span className="field-error">{errors.tagNumber}</span>}</div>
              <div className="field"><label>السلالة *</label><input type="text" value={form.breed} onChange={e => setForm({ ...form, breed: e.target.value })} placeholder="مثال: هولشتاين" />{errors.breed && <span className="field-error">{errors.breed}</span>}</div>
              <div className="field"><label>الجنس *</label><select value={form.gender} onChange={e => setForm({ ...form, gender: e.target.value })}><option value={0}>ذكر</option><option value={1}>أنثى</option></select></div>
              <div className="field"><label>تاريخ الميلاد *</label><input type="date" value={form.birthDate} onChange={e => setForm({ ...form, birthDate: e.target.value })} />{errors.birthDate && <span className="field-error">{errors.birthDate}</span>}</div>
              <div className="field"><label>رقم تاج الأب (اختياري)</label><input type="text" value={form.fatherTagNumber} onChange={e => setForm({ ...form, fatherTagNumber: e.target.value })} /></div>
              <div className="field"><label>رقم تاج الأم (اختياري)</label><input type="text" value={form.motherTagNumber} onChange={e => setForm({ ...form, motherTagNumber: e.target.value })} /></div>
            </div>
            <div className="modal-actions"><button type="submit" className="btn btn-solid">حفظ</button><button type="button" className="btn btn-outline" onClick={() => { setShowCattleForm(false); setForm(emptyForm); setErrors({}); }}>إلغاء</button></div>
          </form>
        </div>
      )}
      <div className="card-box">
        <h4>القطيع <span style={{ display: 'flex', gap: '6px', flexWrap: 'wrap' }}><input type="text" placeholder="بحث برقم التاج أو السلالة..." value={search} onChange={e => setSearch(e.target.value)} style={{ padding: '4px 8px', borderRadius: '8px', border: '1px solid var(--line)', fontSize: '.75rem', minWidth: '160px' }} /><select value={statusFilter} onChange={e => setStatusFilter(e.target.value)} style={{ padding: '4px 8px', borderRadius: '8px', border: '1px solid var(--line)', fontSize: '.75rem' }}><option value="all">كل الحالات</option>{Object.entries(CATTLE_STATUS_MAP).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}</select></span></h4>
        <div className="table-scroll"><table><thead><tr><th>رقم التاج</th><th>السلالة</th><th>الجنس</th><th>العمر</th><th>الأب/الأم</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody>
          {filtered.length === 0 ? <tr><td colSpan="7"><div className="empty-state"><div className="es-ic">🐄</div><div className="es-title">لا توجد نتائج</div><div className="es-sub">جرّب تعديل البحث أو الفلتر، أو سجّل أول رأس ماشية.</div></div></td></tr> :
            filtered.map(c => (
              <tr key={c.id}>
                <td><strong>{c.tagNumber}</strong></td>
                <td>{c.breed}</td>
                <td><span className="gender-ic">{GENDER_MAP[c.gender]?.icon}</span> {GENDER_MAP[c.gender]?.label || '—'}</td>
                <td>{ageLabel(c.birthDate)}</td>
                <td style={{ fontSize: '.75rem', color: 'var(--ink-soft)' }}>{c.fatherTagNumber || '—'} / {c.motherTagNumber || '—'}</td>
                <td>{hasPermission('edit_cattle') && isRealData ? <select value={c.status} disabled={savingStatusId === c.id} onChange={e => handleStatusChange(c, e.target.value)} style={{ padding: '2px 6px', borderRadius: '999px', border: 'none', fontSize: '.65rem', fontWeight: 700, background: '#F1E3BE', color: 'var(--gold)' }}>{Object.entries(CATTLE_STATUS_MAP).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}</select> : <span className={'badge ' + (CATTLE_STATUS_MAP[c.status]?.cls || 'ok')}>{CATTLE_STATUS_MAP[c.status]?.label || '—'}</span>}</td>
                <td><ActionButton allowed={hasPermission('delete_cattle') && isRealData} reason="حذف الماشية متاح فقط لمالك المزرعة" className="btn-outline" onClick={() => handleDelete(c)}>{deletingId === c.id ? '...' : '🗑️ حذف'}</ActionButton></td>
              </tr>
            ))}
        </tbody></table></div>
      </div>
    </div>
  );
}

// ===== HEALTH MANAGEMENT =====
function HealthManagement() {
  const { currentRole, hasPermission, loading, vaccines, setVaccines, vaccinations, setVaccinations, healthLogs, setHealthLogs, cattleOptions, showVaccineForm, setShowVaccineForm, showVaccinationForm, setShowVaccinationForm, showHealthForm, setShowHealthForm, loadData, isRealData } = useAuth();

  const [vaccineForm, setVaccineForm] = useState({ name: '', targetAgeInMonths: '', dosage: '', intervalInDays: '' });
  const [vaccineErrors, setVaccineErrors] = useState({});
  const [vaccinationForm, setVaccinationForm] = useState({ cattleId: '', vaccineId: '', scheduledDate: '' });
  const [vaccinationErrors, setVaccinationErrors] = useState({});
  const [healthForm, setHealthForm] = useState({ cattleId: '', diagnosis: '', treatmentPlan: '', vetNotes: '', isContagious: false });
  const [healthErrors, setHealthErrors] = useState({});
  const [submittingHealth, setSubmittingHealth] = useState(false);

  const vaccineOptions = vaccines.map(v => ({ id: v.id, name: v.name }));

  const validateVaccine = () => {
    const err = {};
    if (!vaccineForm.name.trim()) err.name = 'اسم اللقاح مطلوب';
    const age = Number(vaccineForm.targetAgeInMonths);
    if (isNaN(age) || age < 0) err.targetAgeInMonths = 'العمر يجب أن يكون 0 أو أكبر';
    const dose = Number(vaccineForm.dosage);
    if (isNaN(dose) || dose < 0) err.dosage = 'الجرعة يجب أن تكون 0 أو أكبر';
    if (vaccineForm.intervalInDays && Number(vaccineForm.intervalInDays) < 0) err.intervalInDays = 'الفاصل يجب أن يكون 0 أو أكبر';
    setVaccineErrors(err);
    return Object.keys(err).length === 0;
  };

  const validateVaccination = () => {
    const err = {};
    if (!vaccinationForm.cattleId) err.cattleId = 'اختر بقرة';
    if (!vaccinationForm.vaccineId) err.vaccineId = 'اختر لقاح';
    if (!vaccinationForm.scheduledDate) err.scheduledDate = 'حدد التاريخ';
    setVaccinationErrors(err);
    return Object.keys(err).length === 0;
  };

  const validateHealth = () => {
    const err = {};
    if (!healthForm.cattleId) err.cattleId = 'اختر بقرة';
    if (!healthForm.diagnosis.trim()) err.diagnosis = 'التشخيص مطلوب';
    if (!healthForm.treatmentPlan.trim()) err.treatmentPlan = 'خطة العلاج مطلوبة';
    setHealthErrors(err);
    return Object.keys(err).length === 0;
  };

  const canCreateVaccine = currentRole === VACCINE_CREATOR_ROLE && isRealData;
  const canScheduleVaccination = hasPermission('schedule_vaccination') && isRealData;
  const canAdminister = currentRole === VACCINATION_ADMINISTER_ROLE && isRealData;
  const canEditHealth = currentRole === HEALTH_LOG_EDITOR_ROLE && isRealData;

  const handleAddVaccine = async (e) => {
    e.preventDefault();
    if (!canCreateVaccine) { showToast('⚠️ إضافة أنواع اللقاحات مسؤولية الطبيب البيطري فقط', true); return; }
    if (!validateVaccine()) return;
    try {
      const payload = { name: vaccineForm.name, targetAgeInMonths: Number(vaccineForm.targetAgeInMonths), dosage: Number(vaccineForm.dosage), intervalInDays: vaccineForm.intervalInDays ? Number(vaccineForm.intervalInDays) : null };
      const res = await axiosInstance.post(EP.vaccines, payload);
      setVaccines([...vaccines, res.data]);
      setShowVaccineForm(false);
      setVaccineForm({ name: '', targetAgeInMonths: '', dosage: '', intervalInDays: '' });
      showToast('✅ تم إضافة اللقاح');
      loadData();
    } catch (err) { showToast('فشل الإضافة: ' + errMsg(err), true); }
  };

  const handleAddVaccination = async (e) => {
    e.preventDefault();
    if (!canScheduleVaccination) { showToast('⚠️ جدولة التطعيم متاحة لمالك المزرعة والطبيب البيطري فقط', true); return; }
    if (!validateVaccination()) return;
    try {
      const payload = { cattleId: vaccinationForm.cattleId, vaccineId: vaccinationForm.vaccineId, scheduledDate: new Date(vaccinationForm.scheduledDate).toISOString() };
      const res = await axiosInstance.post(EP.vaccinations, payload);
      setVaccinations([...vaccinations, res.data]);
      setShowVaccinationForm(false);
      setVaccinationForm({ cattleId: '', vaccineId: '', scheduledDate: '' });
      showToast('✅ تمت الجدولة');
      loadData();
    } catch (err) { showToast('فشل الجدولة: ' + errMsg(err), true); }
  };

  const handleAdminister = async (id) => {
    if (!canAdminister) { showToast('⚠️ تسجيل إعطاء اللقاح مسؤولية الطبيب البيطري فقط', true); return; }
    try { await axiosInstance.post(EP.vaccAdminister(id), new Date().toISOString()); showToast('✅ تم تسجيل الإعطاء'); loadData(); } catch (err) { showToast('فشل الإعطاء: ' + errMsg(err), true); }
  };

  const handleAddHealth = async (e) => {
    e.preventDefault();
    if (!canEditHealth) { showToast('⚠️ إضافة السجلات الصحية مسؤولية الطبيب البيطري فقط', true); return; }
    if (submittingHealth) return;
    if (!validateHealth()) return;
    setSubmittingHealth(true);
    try {
      const payload = { cattleId: healthForm.cattleId, diagnosis: healthForm.diagnosis, treatmentPlan: healthForm.treatmentPlan, vetNotes: healthForm.vetNotes || null, isContagious: healthForm.isContagious };
      const res = await axiosInstance.post(EP.healthLogs, payload);
      setHealthLogs([...healthLogs, res.data]);
      setShowHealthForm(false);
      setHealthForm({ cattleId: '', diagnosis: '', treatmentPlan: '', vetNotes: '', isContagious: false });
      showToast('✅ تم إضافة السجل الصحي');
      loadData();
    } catch (err) { showToast('فشل الإضافة: ' + errMsg(err), true); }
    finally { setSubmittingHealth(false); }
  };

  if (loading) return <div className="loading-box"><span className="spinner"></span>جاري تحميل البيانات...</div>;

  return (
    <div>
      <div className="view-head"><div><h1>💉 الجدول الطبي والتطعيمات</h1><p>إدارة اللقاحات، التطعيمات، والسجلات الصحية</p></div></div>
      <div className="card-box">
        <h4>أنواع اللقاحات <ActionButton allowed={canCreateVaccine} reason="إضافة أنواع اللقاحات مسؤولية الطبيب البيطري فقط" className="btn-solid" onClick={() => setShowVaccineForm(true)}>+ إضافة لقاح</ActionButton></h4>
        {showVaccineForm && canCreateVaccine && (
          <div className="card-box" style={{ marginBottom: '12px' }}>
            <h4>إضافة نوع لقاح جديد</h4>
            <form onSubmit={handleAddVaccine}>
              <div className="form-grid-2">
                <div className="field"><label>اسم اللقاح *</label><input type="text" value={vaccineForm.name} onChange={e => setVaccineForm({ ...vaccineForm, name: e.target.value })} />{vaccineErrors.name && <span className="field-error">{vaccineErrors.name}</span>}</div>
                <div className="field"><label>العمر المستهدف (شهر) *</label><input type="number" value={vaccineForm.targetAgeInMonths} onChange={e => setVaccineForm({ ...vaccineForm, targetAgeInMonths: e.target.value })} min="0" step="1" />{vaccineErrors.targetAgeInMonths && <span className="field-error">{vaccineErrors.targetAgeInMonths}</span>}</div>
                <div className="field"><label>الجرعة *</label><input type="number" value={vaccineForm.dosage} onChange={e => setVaccineForm({ ...vaccineForm, dosage: e.target.value })} min="0" step="0.1" />{vaccineErrors.dosage && <span className="field-error">{vaccineErrors.dosage}</span>}</div>
                <div className="field"><label>الفاصل الزمني (أيام)</label><input type="number" value={vaccineForm.intervalInDays} onChange={e => setVaccineForm({ ...vaccineForm, intervalInDays: e.target.value })} min="0" step="1" />{vaccineErrors.intervalInDays && <span className="field-error">{vaccineErrors.intervalInDays}</span>}</div>
              </div>
              <div className="modal-actions"><button type="submit" className="btn btn-solid">حفظ</button><button type="button" className="btn btn-outline" onClick={() => setShowVaccineForm(false)}>إلغاء</button></div>
            </form>
          </div>
        )}
        <div className="table-scroll"><table><thead><tr><th>الاسم</th><th>العمر (شهر)</th><th>الجرعة</th><th>الفاصل (يوم)</th></tr></thead><tbody>{vaccines.length === 0 ? <tr><td colSpan="4" className="empty-row">لا توجد لقاحات</td></tr> : vaccines.map(v => <tr key={v.id}><td>{v.name}</td><td>{v.targetAgeInMonths}</td><td>{v.dosage}</td><td>{v.intervalInDays || '—'}</td></tr>)}</tbody></table></div>
      </div>
      <div className="card-box">
        <h4>التطعيمات <ActionButton allowed={canScheduleVaccination} reason="جدولة التطعيمات متاحة لمالك المزرعة والطبيب البيطري فقط" className="btn-solid" onClick={() => setShowVaccinationForm(true)}>+ جدولة تطعيم</ActionButton></h4>
        {showVaccinationForm && canScheduleVaccination && (
          <div className="card-box" style={{ marginBottom: '12px' }}>
            <h4>جدولة تطعيم جديد</h4>
            <form onSubmit={handleAddVaccination}>
              <div className="form-grid-3">
                <div className="field"><label>البقرة *</label><select value={vaccinationForm.cattleId} onChange={e => setVaccinationForm({ ...vaccinationForm, cattleId: e.target.value })}><option value="">اختر بقرة</option>{cattleOptions.map(c => <option key={c.id} value={c.id}>{c.tagNumber}</option>)}</select>{vaccinationErrors.cattleId && <span className="field-error">{vaccinationErrors.cattleId}</span>}</div>
                <div className="field"><label>نوع اللقاح *</label><select value={vaccinationForm.vaccineId} onChange={e => setVaccinationForm({ ...vaccinationForm, vaccineId: e.target.value })}><option value="">اختر لقاح</option>{vaccineOptions.map(v => <option key={v.id} value={v.id}>{v.name}</option>)}</select>{vaccinationErrors.vaccineId && <span className="field-error">{vaccinationErrors.vaccineId}</span>}</div>
                <div className="field"><label>التاريخ *</label><input type="date" value={vaccinationForm.scheduledDate} onChange={e => setVaccinationForm({ ...vaccinationForm, scheduledDate: e.target.value })} />{vaccinationErrors.scheduledDate && <span className="field-error">{vaccinationErrors.scheduledDate}</span>}</div>
              </div>
              <div className="modal-actions"><button type="submit" className="btn btn-solid">حفظ</button><button type="button" className="btn btn-outline" onClick={() => setShowVaccinationForm(false)}>إلغاء</button></div>
            </form>
          </div>
        )}
        <div className="table-scroll"><table><thead><tr><th>البقرة</th><th>اللقاح</th><th>الموعد</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody>{vaccinations.length === 0 ? <tr><td colSpan="5" className="empty-row">لا توجد تطعيمات</td></tr> : vaccinations.map(v => (<tr key={v.id}><td>{v.cattleTagNumber}</td><td>{v.vaccineName}</td><td>{new Date(v.scheduledDate).toLocaleDateString('ar-EG')}</td><td><span className={'badge ' + (v.administeredDate ? 'ok' : 'pending')}>{v.administeredDate ? 'تم الإعطاء' : 'مجدول'}</span></td><td>{!v.administeredDate && <ActionButton allowed={canAdminister} reason="تسجيل إعطاء اللقاح متاح للطبيب البيطري فقط" className="btn-outline" onClick={() => handleAdminister(v.id)}>تم الإعطاء</ActionButton>}</td></tr>))}</tbody></table></div>
      </div>
      <div className="card-box">
        <h4>السجلات الصحية <ActionButton allowed={canEditHealth} reason="إضافة السجلات الصحية مسؤولية الطبيب البيطري فقط" className="btn-solid" onClick={() => setShowHealthForm(true)}>+ إضافة سجل صحي</ActionButton></h4>
        {showHealthForm && canEditHealth && (
          <div className="card-box" style={{ marginBottom: '12px' }}>
            <h4>إضافة سجل صحي جديد</h4>
            <form onSubmit={handleAddHealth}>
              <div className="form-grid-2">
                <div className="field"><label>البقرة *</label><select value={healthForm.cattleId} onChange={e => setHealthForm({ ...healthForm, cattleId: e.target.value })}><option value="">اختر بقرة</option>{cattleOptions.map(c => <option key={c.id} value={c.id}>{c.tagNumber}</option>)}</select>{healthErrors.cattleId && <span className="field-error">{healthErrors.cattleId}</span>}</div>
                <div className="field"><label>التشخيص *</label><input type="text" value={healthForm.diagnosis} onChange={e => setHealthForm({ ...healthForm, diagnosis: e.target.value })} />{healthErrors.diagnosis && <span className="field-error">{healthErrors.diagnosis}</span>}</div>
                <div className="field"><label>خطة العلاج *</label><input type="text" value={healthForm.treatmentPlan} onChange={e => setHealthForm({ ...healthForm, treatmentPlan: e.target.value })} />{healthErrors.treatmentPlan && <span className="field-error">{healthErrors.treatmentPlan}</span>}</div>
                <div className="field"><label>ملاحظات البيطري</label><input type="text" value={healthForm.vetNotes} onChange={e => setHealthForm({ ...healthForm, vetNotes: e.target.value })} /></div>
                <div className="field" style={{ display: 'flex', alignItems: 'center', gap: '6px' }}><label style={{ margin: 0 }}><input type="checkbox" checked={healthForm.isContagious} onChange={e => setHealthForm({ ...healthForm, isContagious: e.target.checked })} /> حالة معدية</label></div>
              </div>
              <div className="modal-actions"><button type="submit" className="btn btn-solid" disabled={submittingHealth}>{submittingHealth ? '...جاري الحفظ' : 'حفظ'}</button><button type="button" className="btn btn-outline" onClick={() => setShowHealthForm(false)} disabled={submittingHealth}>إلغاء</button></div>
            </form>
          </div>
        )}
        <div className="table-scroll"><table><thead><tr><th>البقرة</th><th>التشخيص</th><th>خطة العلاج</th><th>معدية؟</th></tr></thead><tbody>{healthLogs.length === 0 ? <tr><td colSpan="4" className="empty-row">لا توجد سجلات صحية</td></tr> : healthLogs.map(h => (<tr key={h.id}><td>{h.cattleTagNumber}</td><td>{h.diagnosis}</td><td>{h.treatmentPlan}</td><td>{h.isContagious ? 'نعم' : 'لا'}</td></tr>))}</tbody></table></div>
      </div>
    </div>
  );
}

// ===== STAFF MANAGEMENT =====
function StaffManagement() {
  const { staffList, setStaffList, isOwner, loadData, isRealData } = useAuth();
  const [showForm, setShowForm] = useState(false);
  const [formData, setFormData] = useState({ fullName: '', email: '', password: '', role: 'Vet' });
  const [errors, setErrors] = useState({});

  if (!isOwner) {
    return <div className="card-box"><div className="empty-state"><div className="es-ic">🔒</div><div className="es-title">هذه الصفحة متاحة لمالك المزرعة فقط</div><div className="es-sub">ليس لديك صلاحية الوصول إلى إدارة الموظفين</div></div></div>;
  }

  const validate = () => {
    const err = {};
    if (!formData.fullName.trim()) err.fullName = 'الاسم مطلوب';
    if (!formData.email.trim()) err.email = 'البريد الإلكتروني مطلوب';
    else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(formData.email)) err.email = 'صيغة البريد الإلكتروني غير صحيحة';
    if (!formData.password || formData.password.length < 6) err.password = 'كلمة المرور 6 أحرف على الأقل';
    setErrors(err);
    return Object.keys(err).length === 0;
  };

  const handleAdd = async (e) => {
    e.preventDefault();
    if (!isOwner) { showToast('⚠️ إدارة الموظفين متاحة لمالك المزرعة فقط', true); return; }
    if (!isRealData) { showToast('⚠️ لا يمكن تعديل بيانات تجريبية', true); return; }
    if (!validate()) return;
    try {
      const roleInt = ROLE_STRING_TO_INT[formData.role];
      const payload = { fullName: formData.fullName, email: formData.email, password: formData.password, role: roleInt };
      const res = await axiosInstance.post(EP.users, payload);
      setStaffList([...staffList, res.data]);
      setShowForm(false);
      setFormData({ fullName: '', email: '', password: '', role: 'Vet' });
      showToast('✅ تم إضافة الموظف');
      loadData();
    } catch (err) { showToast('فشل الإضافة: ' + errMsg(err), true); }
  };

  return (
    <div>
      <div className="view-head"><div><h1>👥 إدارة الموظفين</h1><p>إضافة وإدارة أطباء بيطريين وعمال</p></div><ActionButton allowed={isOwner && isRealData} reason="إدارة الموظفين متاحة لمالك المزرعة فقط" className="btn-solid" onClick={() => setShowForm(true)}>+ إضافة موظف</ActionButton></div>
      {showForm && isOwner && isRealData && (
        <div className="card-box">
          <h4>إضافة موظف جديد</h4>
          <form onSubmit={handleAdd}>
            <div className="form-grid-2">
              <div className="field"><label>الاسم الكامل *</label><input type="text" value={formData.fullName} onChange={e => setFormData({ ...formData, fullName: e.target.value })} />{errors.fullName && <span className="field-error">{errors.fullName}</span>}</div>
              <div className="field"><label>البريد الإلكتروني *</label><input type="email" value={formData.email} onChange={e => setFormData({ ...formData, email: e.target.value })} />{errors.email && <span className="field-error">{errors.email}</span>}</div>
              <div className="field"><label>كلمة المرور *</label><input type="password" value={formData.password} onChange={e => setFormData({ ...formData, password: e.target.value })} />{errors.password && <span className="field-error">{errors.password}</span>}</div>
              <div className="field"><label>الدور</label><select value={formData.role} onChange={e => setFormData({ ...formData, role: e.target.value })}><option value="Vet">بيطري</option><option value="Worker">عامل</option></select></div>
            </div>
            <div className="modal-actions"><button type="submit" className="btn btn-solid">حفظ</button><button type="button" className="btn btn-outline" onClick={() => setShowForm(false)}>إلغاء</button></div>
          </form>
        </div>
      )}
      <div className="card-box">
        <div className="table-scroll"><table><thead><tr><th>الاسم</th><th>البريد</th><th>الدور</th></tr></thead><tbody>{staffList.length === 0 ? <tr><td colSpan="3" className="empty-row">لا يوجد موظفون</td></tr> : staffList.map(s => (<tr key={s.id}><td>{s.fullName}</td><td>{s.email}</td><td>{getRoleDisplay(s.role)}</td></tr>))}</tbody></table></div>
      </div>
    </div>
  );
}

// ===== ALERTS =====
function AlertsPage() {
  const { alerts, setAlerts, hasPermission, isRealData } = useAuth();

  const resolveAlert = (id) => {
    if (!hasPermission('administer')) { showToast('⚠️ ليس لديك صلاحية لإصلاح التنبيهات', true); return; }
    setAlerts(alerts.map(a => a.id === id ? { ...a, active: false, time: 'تم الإصلاح' } : a));
    showToast('✅ تم إصلاح التنبيه');
  };

  return (
    <div>
      <div className="view-head"><div><h1>📡 التنبيهات اللحظية</h1><p>تنبيهات المستشعرات</p></div></div>
      <div className="card-box">
        {alerts.length === 0 ? (
          <div className="empty-state"><div className="es-ic">{isRealData ? '📡' : '🎉'}</div><div className="es-title">{isRealData ? 'لا يوجد بث حي من المستشعرات بعد' : 'لا توجد تنبيهات نشطة'}</div><div className="es-sub">{isRealData ? 'وصّل أجهزة استشعار المزرعة لتصلك التنبيهات هنا أولاً بأول.' : 'هذا مثال توضيحي — سجّل حسابك لتتابع تنبيهات مزرعتك الحقيقية.'}</div></div>
        ) : alerts.map(a => (
          <div key={a.id} className="alert-item">
            <span className={'dot ' + (a.active ? 'red' : 'gray')}></span>
            <div className="body"><div><strong>{a.text}</strong></div><div className="meta">{a.time} · <span className={'badge ' + (a.active ? 'active' : 'ok')}>{a.active ? 'نشط' : 'تم الحل'}</span></div></div>
            <div className="alert-actions">{a.active && <ActionButton allowed={hasPermission('administer') && isRealData} reason="إصلاح التنبيهات متاح لمالك المزرعة والطبيب البيطري فقط" className="btn-outline" onClick={() => resolveAlert(a.id)}>إصلاح التنبيه</ActionButton>}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ===== AUTH MODAL =====
const PASSWORD_RULES = [
  { key: 'len', label: '8 أحرف على الأقل', test: p => p.length >= 8 },
  { key: 'upper', label: 'حرف إنجليزي كبير واحد على الأقل (A-Z)', test: p => /[A-Z]/.test(p) },
  { key: 'lower', label: 'حرف إنجليزي صغير واحد على الأقل (a-z)', test: p => /[a-z]/.test(p) },
  { key: 'num', label: 'رقم واحد على الأقل (0-9)', test: p => /[0-9]/.test(p) },
  { key: 'special', label: 'رمز خاص واحد على الأقل (!@#$...)', test: p => /[^A-Za-z0-9]/.test(p) }
];

function passwordScore(p) { return PASSWORD_RULES.filter(r => r.test(p)).length; }

function PasswordChecklist({ password }) {
  const score = passwordScore(password);
  const pct = (score / PASSWORD_RULES.length) * 100;
  const color = score <= 1 ? 'var(--rust)' : score <= 3 ? 'var(--gold)' : 'var(--green)';
  return (
    <div>
      <div className="pw-strength-bar"><div className="pw-strength-fill" style={{ width: pct + '%', background: color }}></div></div>
      <ul className="pw-checklist">{PASSWORD_RULES.map(r => { const ok = r.test(password); return <li key={r.key} className={ok ? 'ok' : ''}><span className="pw-ic">{ok ? '✓' : '•'}</span>{r.label}</li>; })}</ul>
    </div>
  );
}

function isValidEmailFormat(e) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }

function AuthModal({ onLogin }) {
  const [tab, setTab] = useState('login');
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [farmName, setFarmName] = useState('');
  const [ownerName, setOwnerName] = useState('');
  const [error, setError] = useState('');
  const [submitting, setSubmitting] = useState(false);
  const [touchedPassword, setTouchedPassword] = useState(false);

  const switchTab = (t) => { setTab(t); setError(''); };
  const isPasswordValid = tab === 'login' ? password.length > 0 : passwordScore(password) === PASSWORD_RULES.length;

  const handleSubmit = async (e) => {
    e.preventDefault();
    setError('');
    if (!email.trim()) { setError('يرجى إدخال البريد الإلكتروني'); return; }
    if (!isValidEmailFormat(email.trim())) { setError('صيغة البريد الإلكتروني غير صحيحة'); return; }
    if (!password) { setError('يرجى إدخال كلمة المرور'); return; }
    if (tab === 'register') {
      if (!farmName.trim()) { setError('يرجى إدخال اسم المزرعة'); return; }
      if (!ownerName.trim()) { setError('يرجى إدخال اسم المالك'); return; }
      if (!isPasswordValid) { setTouchedPassword(true); setError('كلمة المرور لا تحقق كل الشروط المطلوبة بالأسفل'); return; }
    }
    setSubmitting(true);
    try {
      if (tab === 'login') {
        await onLogin(email.trim(), password);
        document.getElementById('authModal').classList.add('hidden');
      } else {
        const res = await axiosInstance.post(EP.register, { farmName: farmName.trim(), ownerName: ownerName.trim(), email: email.trim(), password });
        if (res.data.accessToken) { persistSession(res.data); window.location.reload(); }
        else { showToast('✅ تم إنشاء الحساب بنجاح، يمكنك تسجيل الدخول الآن'); switchTab('login'); }
      }
    } catch (err) { setError(errMsg(err, tab === 'login' ? 'فشل تسجيل الدخول، تأكد من صحة البريد الإلكتروني وكلمة المرور' : 'فشل إنشاء الحساب، حاول مرة أخرى')); }
    finally { setSubmitting(false); }
  };

  return (
    <div className="modal-overlay hidden" id="authModal">
      <div className="modal">
        <button className="modal-close" onClick={() => document.getElementById('authModal').classList.add('hidden')}>✕</button>
        <div className="auth-tabs"><button className={'auth-tab ' + (tab === 'login' ? 'active' : '')} onClick={() => switchTab('login')}>تسجيل الدخول</button><button className={'auth-tab ' + (tab === 'register' ? 'active' : '')} onClick={() => switchTab('register')}>حساب جديد</button></div>
        <form onSubmit={handleSubmit}>
          {tab === 'register' && (<><div className="field"><label>اسم المزرعة</label><input type="text" value={farmName} onChange={e => setFarmName(e.target.value)} required /></div><div className="field"><label>اسم المالك</label><input type="text" value={ownerName} onChange={e => setOwnerName(e.target.value)} required /></div></>)}
          <div className="field"><label>البريد الإلكتروني</label><input type="email" value={email} onChange={e => setEmail(e.target.value)} required /></div>
          <div className="field"><label>كلمة المرور</label><input type="password" value={password} required onFocus={() => setTouchedPassword(true)} onChange={e => setPassword(e.target.value)} />{tab === 'register' && (touchedPassword || password.length > 0) && <PasswordChecklist password={password} />}</div>
          {error && <div className="field-error">{error}</div>}
          <div className="modal-actions"><button type="submit" className="btn btn-solid" disabled={submitting || (tab === 'register' && !isPasswordValid)}>{submitting ? '...جاري المعالجة' : (tab === 'login' ? 'دخول' : 'إنشاء الحساب')}</button></div>
        </form>
      </div>
    </div>
  );
}

// ===== RENDER =====
window.openAuthModal = () => document.getElementById('authModal').classList.remove('hidden');
window.logout = logout;

const Root = () => {
  const handleLogin = async (email, password) => {
    try { const res = await axiosInstance.post(EP.login, { email, password }); persistSession(res.data); window.location.reload(); } catch (err) { throw err; }
  };
  return (<><AuthModal onLogin={handleLogin} /><App /></>);
};

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
