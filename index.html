<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>هيردسمارت | النظام المتكامل</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.2/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jwt-decode@4.0.0/build/jwt-decode.min.js"></script>
  <style>
    /* ===== RESET & GLOBAL ===== */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #F3EEDE; color: #202A1E; font-family: 'Tajawal', sans-serif; min-height: 100vh; overflow-x: hidden; }
    :root { --bg: #F3EEDE; --sidebar: #1F3A26; --card: #FFFDF5; --ink: #202A1E; --ink-soft: #5A6553; --green: #3C6B41; --green-deep: #1F3A26; --gold: #C79A45; --rust: #A85234; --line: #E1D6B4; --radius: 12px; }
    .num { font-family: 'JetBrains Mono', monospace; }
    button, input, select { font-family: inherit; cursor: pointer; }
    .topbar { height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; background: var(--card); border-bottom: 1px solid var(--line); flex-wrap: wrap; gap: 8px; position: sticky; top: 0; z-index: 30; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 1.2rem; color: var(--green-deep); }
    .brand .mark { width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(155deg, var(--green), var(--green-deep)); display: flex; align-items: center; justify-content: center; color: #fff; }
    .top-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .status-badge { display: flex; align-items: center; gap: 6px; font-size: .7rem; font-weight: 700; color: var(--ink-soft); background: var(--bg); border: 1px solid var(--line); padding: 4px 12px; border-radius: 999px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #C9BE9C; }
    .status-dot.on { background: var(--green); animation: pulseGreen 2s infinite; }
    @keyframes pulseGreen { 0% { box-shadow: 0 0 0 0 rgba(60, 107, 65, .5); } 70% { box-shadow: 0 0 0 8px rgba(60, 107, 65, 0); } 100% { box-shadow: 0 0 0 0 rgba(60, 107, 65, 0); } }
    .user-chip { display: flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--line); padding: 4px 14px; border-radius: 999px; font-size: .8rem; font-weight: 700; color: var(--green-deep); }
    .user-chip .role-tag { font-size: .65rem; font-weight: 700; background: var(--gold); color: var(--green-deep); padding: 2px 10px; border-radius: 999px; }
    .btn { padding: 8px 16px; border-radius: 9px; font-weight: 700; font-size: .8rem; border: 1.5px solid transparent; transition: all 0.2s; position: relative; overflow: hidden; }
    .btn-solid { background: var(--green-deep); color: #fff; }
    .btn-solid:hover:not(:disabled) { background: var(--green); transform: translateY(-2px); box-shadow: 0 6px 16px -8px rgba(31, 58, 38, .4); }
    .btn-outline { background: transparent; border-color: var(--green-deep); color: var(--green-deep); }
    .btn-outline:hover:not(:disabled) { background: var(--green-deep); color: #fff; transform: translateY(-2px); }
    .btn-small { padding: 4px 10px; font-size: .7rem; border-radius: 6px; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed !important; filter: grayscale(0.6); pointer-events: auto; transform: none !important; }
    .btn:disabled:hover { background: transparent !important; color: inherit !important; transform: none !important; }
    .app-body { display: flex; height: calc(100vh - 64px); }
    .sidebar { width: 220px; background: #1F3A26; color: #EFE9D6; padding: 16px 10px; flex: none; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 10px; color: #D9D3B8; font-weight: 600; font-size: .9rem; background: transparent; border: none; width: 100%; text-align: right; transition: all .2s; }
    .nav-item:hover { background: #2B4B33; color: #fff; padding-right: 18px; }
    .nav-item.active { background: var(--gold); color: var(--green-deep); }
    .nav-item.hidden-role { display: none; }
    .nav-icon { font-size: 1rem; }
    .sidebar-foot { margin-top: auto; font-size: .7rem; color: #93A088; padding: 10px 14px; }
    .content { flex: 1; overflow-y: auto; padding: 24px 28px; }
    .view { display: none; animation: fadein .3s ease; }
    .view.active { display: block; }
    @keyframes fadein { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .view-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    .view-head h1 { font-size: 1.4rem; color: var(--green-deep); font-weight: 900; }
    .view-head p { color: var(--ink-soft); font-size: .85rem; }
    .card-box { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; margin-bottom: 18px; transition: box-shadow .25s, transform .25s; }
    .card-box:hover { box-shadow: 0 10px 24px -14px rgba(31, 58, 38, .25); }
    .card-box h4 { color: var(--green-deep); margin-bottom: 14px; font-size: 1rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
    .table-scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .85rem; min-width: 500px; }
    th { text-align: right; color: var(--ink-soft); font-weight: 700; font-size: .75rem; padding: 8px 8px; border-bottom: 1px solid var(--line); }
    td { padding: 8px 8px; border-bottom: 1px solid var(--line); }
    tr:last-child td { border-bottom: none; }
    tbody tr { transition: background .15s; }
    tbody tr:hover { background: #FAF6E8; }
    .empty-row td { color: var(--ink-soft); text-align: center; padding: 20px; }
    .badge { display: inline-block; padding: 3px 12px; border-radius: 999px; font-size: .7rem; font-weight: 700; }
    .badge.ok { background: #DEEAD9; color: var(--green-deep); }
    .badge.pending { background: #F1E3BE; color: var(--gold); }
    .badge.active { background: #F3DAD1; color: var(--rust); }
    .badge.sold { background: #E7E2CC; color: #6B6547; }
    .badge.dead { background: #EAD6D6; color: #8A3A3A; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: .8rem; font-weight: 700; color: var(--ink-soft); margin-bottom: 4px; }
    .field input, .field select { width: 100%; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; font-size: .9rem; color: var(--ink); transition: border-color .2s, box-shadow .2s; }
    .field input:focus, .field select:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px rgba(60, 107, 65, .15); }
    .field input:disabled, .field select:disabled { background: #f0f0f0; opacity: 0.6; cursor: not-allowed; }
    .field-error { color: var(--rust); font-size: .75rem; margin-top: 4px; display: block; animation: shake .3s ease; }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
    .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
    .modal-actions .btn { flex: 1; text-align: center; }
    #toast-wrap { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: 8px; width: 90%; max-width: 400px; pointer-events: none; }
    .toast { background: var(--green-deep); color: #fff; padding: 12px 20px; border-radius: 10px; font-size: .85rem; font-weight: 600; box-shadow: 0 10px 24px -8px rgba(0, 0, 0, .35); animation: toastin .3s ease; pointer-events: auto; text-align: center; }
    .toast.error { background: var(--rust); }
    @keyframes toastin { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .guest-banner { background: linear-gradient(90deg, #8A6417, #C79A45); color: #fff; padding: 8px 20px; display: flex; align-items: center; justify-content: center; gap: 14px; font-size: .85rem; font-weight: 700; flex-wrap: wrap; text-align: center; }
    .guest-banner button { padding: 4px 16px; border-radius: 999px; font-size: .75rem; font-weight: 700; border: 1.5px solid #fff; background: transparent; color: #fff; transition: background .2s, color .2s; }
    .guest-banner button:hover { background: #fff; color: var(--gold); }
    .hidden { display: none !important; }
    .role-switch { display: flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--line); padding: 4px 12px; border-radius: 999px; font-size: .8rem; color: var(--ink-soft); font-weight: 700; }
    .role-switch select { border: none; background: transparent; font-weight: 700; color: var(--green-deep); font-size: .85rem; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(20, 26, 17, .55); display: flex; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(2px); padding: 16px; animation: modalFade .25s ease; }
    @keyframes modalFade { from { opacity: 0; } to { opacity: 1; } }
    .modal-overlay.hidden { display: none; }
    .modal { background: var(--card); border-radius: 16px; padding: 24px; width: 100%; max-width: 420px; border: 1px solid var(--line); max-height: 90vh; overflow-y: auto; position: relative; animation: modalIn .3s ease; }
    @keyframes modalIn { from { opacity: 0; transform: scale(.95) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    .modal-close { position: absolute; top: 12px; left: 12px; background: none; border: none; font-size: 1.2rem; color: var(--ink-soft); cursor: pointer; transition: transform .2s; }
    .modal-close:hover { transform: rotate(90deg); }
    .auth-tabs { display: flex; gap: 8px; margin-bottom: 18px; background: var(--bg); border-radius: 10px; padding: 4px; }
    .auth-tab { flex: 1; padding: 8px; text-align: center; border-radius: 8px; font-weight: 700; font-size: .85rem; color: var(--ink-soft); border: none; background: transparent; transition: all .2s; }
    .auth-tab.active { background: var(--green-deep); color: #fff; }
    /* Dashboard */
    .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 16px; margin-bottom: 20px; }
    .stat-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; transition: all .2s; animation: cardIn .4s ease backwards; cursor: default; }
    .stat-card:hover { transform: translateY(-3px); box-shadow: 0 10px 20px -12px rgba(31, 58, 38, .3); }
    .stat-card .label { font-size: .75rem; color: var(--ink-soft); font-weight: 700; margin-bottom: 6px; }
    .stat-card .value { font-size: 1.8rem; font-weight: 700; color: var(--green-deep); }
    .stat-card .value.rust { color: var(--rust); }
    .stat-card .sub { font-size: .7rem; color: var(--ink-soft); margin-top: 4px; }
    .stat-row .stat-card:nth-child(1) { animation-delay: .02s; }
    .stat-row .stat-card:nth-child(2) { animation-delay: .08s; }
    .stat-row .stat-card:nth-child(3) { animation-delay: .14s; }
    @keyframes cardIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .gauge-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .gauge { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 14px; text-align: center; }
    .gauge .g-label { font-size: .75rem; color: var(--ink-soft); font-weight: 700; margin-bottom: 4px; }
    .gauge .g-value { font-size: 1.6rem; font-weight: 700; transition: color .3s; }
    .gauge .g-bar { height: 6px; border-radius: 4px; background: var(--line); margin-top: 8px; overflow: hidden; }
    .gauge .g-fill { height: 100%; border-radius: 4px; transition: width .6s cubic-bezier(.4,0,.2,1), background .3s; }
    .producer-row { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--line); }
    .producer-row:last-child { border-bottom: none; }
    .producer-row .liters { font-weight: 600; color: var(--rust); }
    .alert-item { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: flex-start; }
    .alert-item:last-child { border-bottom: none; }
    .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; flex: none; }
    .dot.red { background: var(--rust); animation: pulse 1.8s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(168, 82, 52, .6); } 70% { box-shadow: 0 0 0 10px rgba(168, 82, 52, 0); } 100% { box-shadow: 0 0 0 0 rgba(168, 82, 52, 0); } }
    .dot.gray { background: #C9BE9C; }
    .alert-item .meta { font-size: .75rem; color: var(--ink-soft); margin-top: 2px; }
    .alert-item .body { flex: 1; }
    .live-badge { display: inline-flex; align-items: center; gap: 6px; font-size: .7rem; font-weight: 700; color: var(--rust); }
    .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--rust); animation: pulse 1.8s infinite; }
    .panel-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }

    /* ===== TOOLTIP ===== */
    .tip-wrap { position: relative; display: inline-flex; }
    .tip-wrap .tip-bubble {
      position: absolute; bottom: calc(100% + 8px); right: 50%; transform: translateX(50%) translateY(4px);
      background: var(--green-deep); color: #fff; font-size: .68rem; font-weight: 600; padding: 6px 10px;
      border-radius: 8px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .18s ease, transform .18s ease;
      z-index: 20; box-shadow: 0 6px 16px -6px rgba(0,0,0,.4);
    }
    .tip-wrap .tip-bubble::after {
      content: ''; position: absolute; top: 100%; right: 50%; transform: translateX(50%);
      border: 5px solid transparent; border-top-color: var(--green-deep);
    }
    .tip-wrap:hover .tip-bubble, .tip-wrap:focus-within .tip-bubble { opacity: 1; transform: translateX(50%) translateY(0); }
    .btn.locked { background: #E7E2CC; color: #8C8567; border-color: #E7E2CC; filter: none; opacity: 1; }
    .btn.locked:hover { background: #E7E2CC !important; color: #8C8567 !important; transform: none !important; }
    .btn.locked .lock-ic { margin-left: 4px; }

    /* ===== PASSWORD STRENGTH ===== */
    .pw-checklist { list-style: none; margin-top: 8px; display: grid; gap: 5px; padding: 10px 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
    .pw-checklist li { display: flex; align-items: center; gap: 8px; font-size: .74rem; color: var(--ink-soft); font-weight: 600; transition: color .2s ease; }
    .pw-checklist li .pw-ic { width: 16px; height: 16px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: .62rem; background: #E1D6B4; color: #fff; flex: none; transition: background .25s, transform .25s; }
    .pw-checklist li.ok { color: var(--green-deep); }
    .pw-checklist li.ok .pw-ic { background: var(--green); transform: scale(1.08); }
    .pw-strength-bar { height: 5px; border-radius: 4px; background: var(--line); margin-top: 8px; overflow: hidden; }
    .pw-strength-fill { height: 100%; border-radius: 4px; transition: width .3s, background .3s; }

    /* ===== FEATURE SHOWCASE ===== */
    .feature-hero { background: linear-gradient(135deg, var(--green-deep), var(--green) 120%); border-radius: 16px; padding: 26px 24px; margin-bottom: 20px; color: #F3EEDE; position: relative; overflow: hidden; }
    .feature-hero::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 85% 20%, rgba(199,154,69,.25), transparent 55%); }
    .feature-hero h2 { font-size: 1.25rem; font-weight: 900; margin-bottom: 6px; position: relative; }
    .feature-hero p { font-size: .85rem; opacity: .85; max-width: 560px; position: relative; }
    .feature-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 16px; position: relative; }
    .feature-chip { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18); border-radius: 10px; padding: 12px; transition: background .2s, transform .2s; }
    .feature-chip:hover { background: rgba(255,255,255,.18); transform: translateY(-2px); }
    .feature-chip .fc-ic { font-size: 1.2rem; margin-bottom: 6px; }
    .feature-chip .fc-title { font-size: .78rem; font-weight: 700; margin-bottom: 2px; }
    .feature-chip .fc-desc { font-size: .68rem; opacity: .75; line-height: 1.4; }

    .gender-ic { font-size: .9rem; }

    /* ===== ANIMATIONS ===== */
    .cow-walk {
      position: fixed; bottom: 20px; left: -60px; font-size: 2.8rem; z-index: 45;
      animation: cowWalk 18s linear infinite; pointer-events: none;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,.15));
    }
    @keyframes cowWalk {
      0% { left: -60px; transform: scaleX(1); }
      45% { left: calc(100% + 20px); transform: scaleX(1); }
      50% { left: calc(100% + 20px); transform: scaleX(-1); }
      95% { left: -60px; transform: scaleX(-1); }
      100% { left: -60px; transform: scaleX(1); }
    }
    .milk-drop { display: inline-block; animation: milkDrop 1.2s ease-in-out infinite; }
    @keyframes milkDrop { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(4px) scale(1.1); } }
    .pulse-icon { animation: pulseIcon 2s ease-in-out infinite; display: inline-block; }
    @keyframes pulseIcon { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }

    /* ===== MEDIA QUERIES ===== */
    @media(max-width: 1024px) {
      .panel-grid { grid-template-columns: 1fr; }
    }
    @media(max-width: 768px) {
      .sidebar { width: 60px; padding: 12px 6px; }
      .nav-item span.label { display: none; }
      .nav-item { justify-content: center; padding: 12px 8px; }
      .nav-item:hover:not(.active) { padding-right: 8px; }
      .content { padding: 16px 12px; }
      .stat-row { grid-template-columns: 1fr 1fr; }
      .top-right .user-chip { display: none; }
      .form-grid-2, .form-grid-3 { grid-template-columns: 1fr; }
      .gauge-grid { grid-template-columns: 1fr 1fr; }
      .feature-grid { grid-template-columns: 1fr 1fr; }
      .modal { padding: 16px; max-width: 95%; }
      .cow-walk { font-size: 2rem; bottom: 10px; }
    }
    @media(max-width: 480px) {
      .topbar { padding: 0 10px; height: 56px; }
      .brand { font-size: .9rem; }
      .brand .mark { width: 28px; height: 28px; font-size: .9rem; }
      .top-right .status-badge { font-size: .6rem; padding: 2px 8px; }
      .guest-banner { font-size: .7rem; padding: 6px 12px; flex-direction: column; gap: 6px; }
      .guest-banner .banner-actions { flex-wrap: wrap; justify-content: center; }
      .view-head { flex-direction: column; align-items: flex-start; }
      .view-head h1 { font-size: 1.1rem; }
      .view-head p { font-size: .75rem; }
      .stat-row { grid-template-columns: 1fr; gap: 10px; }
      .stat-card { padding: 12px; }
      .stat-card .value { font-size: 1.4rem; }
      .card-box { padding: 14px; }
      .card-box h4 { font-size: .85rem; flex-direction: column; align-items: stretch; }
      .card-box h4 > span { width: 100%; display: flex; flex-direction: column; gap: 6px; }
      .card-box h4 input, .card-box h4 select { width: 100%; }
      .gauge-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
      .gauge { padding: 10px; }
      .gauge .g-value { font-size: 1.2rem; }
      .form-grid-2, .form-grid-3 { grid-template-columns: 1fr; gap: 10px; }
      .field { margin-bottom: 10px; }
      .modal-actions .btn { flex: 1 1 100%; }
      .modal-actions { flex-direction: column; }
      .top-right .role-switch { font-size: .7rem; padding: 2px 8px; }
      .top-right .role-switch select { font-size: .75rem; }
      .btn { padding: 6px 12px; font-size: .7rem; }
      .btn-small { padding: 3px 8px; font-size: .6rem; }
      .cow-walk { font-size: 1.6rem; bottom: 6px; }
      .feature-hero { padding: 16px; }
      .feature-hero h2 { font-size: 1rem; }
      .feature-grid { grid-template-columns: 1fr 1fr; gap: 6px; }
      .feature-chip { padding: 8px; }
      .feature-chip .fc-ic { font-size: 1rem; }
      .feature-chip .fc-title { font-size: .7rem; }
      .feature-chip .fc-desc { font-size: .6rem; }
      .table-scroll { overflow-x: auto; }
      table { font-size: .75rem; min-width: 400px; }
      th, td { padding: 6px; }
      .tip-wrap .tip-bubble { white-space: normal; max-width: 140px; text-align: center; line-height: 1.3; font-size: .6rem; }
    }
    @media(max-width: 360px) {
      .topbar { padding: 0 6px; }
      .brand { font-size: .8rem; gap: 4px; }
      .brand .mark { width: 24px; height: 24px; font-size: .8rem; }
      .top-right { gap: 4px; }
      .status-badge { font-size: .5rem; padding: 1px 6px; }
      .btn { padding: 4px 8px; font-size: .6rem; }
      .stat-card .value { font-size: 1.2rem; }
      .gauge-grid { grid-template-columns: 1fr; }
      .cow-walk { font-size: 1.2rem; }
    }
    .loading-box { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 40px 20px; color: var(--ink-soft); font-size: .85rem; font-weight: 700; }
    .spinner { width: 26px; height: 26px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--green); animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty-state { text-align: center; padding: 30px 16px; color: var(--ink-soft); }
    .empty-state .es-ic { font-size: 1.8rem; margin-bottom: 8px; }
    .empty-state .es-title { font-weight: 700; color: var(--green-deep); font-size: .9rem; margin-bottom: 3px; }
    .empty-state .es-sub { font-size: .75rem; }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="toast-wrap"></div>
  <!-- بقرة تمشي في الخلفية -->
  <div class="cow-walk">🐄</div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback, createContext, useContext } = React;

    // ============================================================
    // 1. CONFIG & RBAC
    // ============================================================
    const API_BASE = 'https://herdsmart.runasp.net/api';
    const EP = {
      login: '/Auth/login',
      register: '/Auth/register',
      refresh: '/Auth/refresh-token',
      vaccines: '/vaccines',
      vaccinations: '/vaccinations',
      vaccAdminister: id => `/vaccinations/${id}/administer`,
      healthLogs: '/health-logs',
      cattle: '/Cattle',
      cattleOne: id => `/Cattle/${id}`,
      cattleStatus: id => `/Cattle/${id}/status`,
      users: '/users',
      milk: '/milk',
      milkTop: '/milk/top-producers',
      milkSummary: '/milk/summary'
    };

    // تعريف الصلاحيات لكل دور
    const ROLES_DEF = {
      Owner: ['create_cattle', 'edit_cattle', 'delete_cattle', 'view', 'manageStaff', 'administer'],
      Vet: ['create_cattle', 'edit_cattle', 'view', 'create_vaccine', 'schedule_vaccination', 'administer', 'create_health', 'edit_health'],
      Worker: ['view'],
      Guest: ['view']
    };
    const roleNames = {
      Owner: 'مالك المزرعة',
      Vet: 'بيطري',
      Worker: 'عامل',
      Guest: 'ضيف'
    };

    // خريطة الأدوار الرقمية إلى أسماء (حسب الـ API)
    const ROLE_INT_MAP = { 0: 'Owner', 1: 'Vet', 2: 'Worker' };
    const ROLE_STRING_TO_INT = { Owner: 0, Vet: 1, Worker: 2 };

    function getRoleDisplay(role) {
      if (typeof role === 'number') {
        const key = ROLE_INT_MAP[role];
        return roleNames[key] || role;
      }
      return roleNames[role] || role;
    }

    // ===== فك تشفير JWT بشكل صحيح مع دعم جميع تنسيقات الـ Claims =====
    function decodeToken(token) {
      try {
        const decoded = jwtDecode(token);
        // محاولة استخراج الدور من عدة مصادر محتملة
        let roles = decoded.roles || 
                    decoded.role || 
                    decoded['http://schemas.microsoft.com/ws/2008/06/identity/claims/role'] ||
                    decoded['role'] || 
                    [];
        if (!Array.isArray(roles)) roles = [roles];
        // تحويل الأدوار الرقمية إلى نصوص
        roles = roles.map(r => {
          if (typeof r === 'number') return ROLE_INT_MAP[r] || r;
          return r;
        });
        // استخراج الاسم من الـ Claims
        const name = decoded['http://schemas.xmlsoap.org/ws/2005/05/identity/claims/name'] ||
                     decoded['http://schemas.microsoft.com/ws/2008/06/identity/claims/name'] ||
                     decoded['name'] ||
                     decoded['unique_name'] ||
                     'مستخدم';
        return { roles: roles.length ? roles : ['Guest'], name };
      } catch (e) { 
        return { roles: ['Guest'], name: 'ضيف' }; 
      }
    }

    // الأدوار المسموح بها لإجراءات محددة
    const CATTLE_DELETE_ROLE = 'Owner';
    const VACCINE_CREATOR_ROLE = 'Vet';
    const VACCINATION_ADMINISTER_ROLE = 'Vet';
    const HEALTH_LOG_EDITOR_ROLE = 'Vet';

    const GENDER_MAP = { 0: { label: 'ذكر', icon: '♂️' }, 1: { label: 'أنثى', icon: '♀️' } };
    const CATTLE_STATUS_MAP = {
      0: { label: 'نشطة', cls: 'ok' },
      1: { label: 'مريضة', cls: 'active' },
      2: { label: 'حامل', cls: 'pending' },
      3: { label: 'مباعة', cls: 'sold' },
      4: { label: 'نافقة', cls: 'dead' }
    };

    // ============================================================
    // 2. MOCK DATA (فقط للضيف)
    // ============================================================
    const MOCK = {
      vaccines: [
        { id: 'v1', name: 'الحمى القلاعية', targetAgeInMonths: 3, dosage: 2, intervalInDays: null },
        { id: 'v2', name: 'البروسيلا', targetAgeInMonths: 6, dosage: 1.5, intervalInDays: 30 },
        { id: 'v3', name: 'الجمرة الخبيثة', targetAgeInMonths: 12, dosage: 3, intervalInDays: null }
      ],
      vaccinations: [
        { id: 'vc1', cattleTagNumber: 'A102', vaccineName: 'الحمى القلاعية', scheduledDate: '2026-07-10T00:00:00', administeredDate: null },
        { id: 'vc2', cattleTagNumber: 'A245', vaccineName: 'البروسيلا', scheduledDate: '2026-08-01T00:00:00', administeredDate: null },
        { id: 'vc3', cattleTagNumber: 'A088', vaccineName: 'الجمرة الخبيثة', scheduledDate: '2026-06-15T00:00:00', administeredDate: '2026-06-15T00:00:00' }
      ],
      healthLogs: [
        { id: 'h1', cattleTagNumber: 'A088', diagnosis: 'التهاب الضرع', treatmentPlan: 'مضاد حيوي موضعي 5 أيام', isContagious: false },
        { id: 'h2', cattleTagNumber: 'A245', diagnosis: 'عرج خفيف', treatmentPlan: 'راحة وتقليم الأظلاف', isContagious: false }
      ],
      cattle: [
        { id: 'c1', tagNumber: 'A102', breed: 'هولشتاين', gender: 0, birthDate: '2023-02-11T00:00:00', status: 0, fatherTagNumber: null, motherTagNumber: 'A050' },
        { id: 'c2', tagNumber: 'A245', breed: 'بلدي', gender: 0, birthDate: '2022-08-03T00:00:00', status: 0, fatherTagNumber: 'A010', motherTagNumber: null },
        { id: 'c3', tagNumber: 'A310', breed: 'جيرسي', gender: 0, birthDate: '2023-11-20T00:00:00', status: 0, fatherTagNumber: null, motherTagNumber: null },
        { id: 'c4', tagNumber: 'A088', breed: 'هولشتاين', gender: 1, birthDate: '2021-05-14T00:00:00', status: 1, fatherTagNumber: null, motherTagNumber: null }
      ],
      staff: [
        { id: 's1', fullName: 'د. كريم عادل', email: 'kareem@farm.com', role: 'Vet' },
        { id: 's2', fullName: 'أميرة فوزي', email: 'amira@farm.com', role: 'Worker' },
        { id: 's3', fullName: 'محمود الجندي', email: 'mahmoud@farm.com', role: 'Worker' }
      ],
      weeklyMilk: [1620, 1710, 1690, 1780, 1750, 1810, 1840],
      topProducers: [
        { tagNumber: 'A102', totalLiters: 27.4 },
        { tagNumber: 'A245', totalLiters: 25.1 },
        { tagNumber: 'A310', totalLiters: 24.6 }
      ],
      alerts: [
        { id: 'a1', text: 'ارتفاع درجة الحرارة — البقرة #A102 (8.7/10)', time: 'الآن', active: true },
        { id: 'a2', text: 'مستوى حركة منخفض — البقرة #A245 (2.1/10)', time: 'منذ 5 دقائق', active: true }
      ]
    };

    // ============================================================
    // 3. AXIOS INSTANCE
    // ============================================================
    const axiosInstance = axios.create({ baseURL: API_BASE, headers: { 'Content-Type': 'application/json' } });
    axiosInstance.interceptors.request.use(config => {
      const token = localStorage.getItem('hs_token');
      if (token) config.headers.Authorization = `Bearer ${token}`;
      return config;
    });

    let isRefreshing = false;
    let failedQueue = [];
    const processQueue = (error, token = null) => {
      failedQueue.forEach(prom => { if (error) prom.reject(error); else prom.resolve(token); });
      failedQueue = [];
    };
    axiosInstance.interceptors.response.use(
      res => res,
      async error => {
        const originalRequest = error.config;
        if (error.response?.status === 401 && !originalRequest._retry) {
          if (isRefreshing) {
            return new Promise((resolve, reject) => {
              failedQueue.push({ resolve, reject });
            }).then(token => {
              originalRequest.headers.Authorization = `Bearer ${token}`;
              return axiosInstance(originalRequest);
            }).catch(err => Promise.reject(err));
          }
          originalRequest._retry = true;
          isRefreshing = true;
          const refreshToken = localStorage.getItem('hs_refreshToken');
          if (!refreshToken) { isRefreshing = false; window.logout(); return Promise.reject(error); }
          try {
            const res = await axios.post(API_BASE + EP.refresh, {
              refreshToken,
              accessToken: localStorage.getItem('hs_token')
            });
            const newToken = res.data.accessToken;
            localStorage.setItem('hs_token', newToken);
            if (res.data.refreshToken) localStorage.setItem('hs_refreshToken', res.data.refreshToken);
            processQueue(null, newToken);
            originalRequest.headers.Authorization = `Bearer ${newToken}`;
            return axiosInstance(originalRequest);
          } catch (e) {
            processQueue(e, null);
            window.logout();
            showToast('انتهت الجلسة، يرجى تسجيل الدخول مجدداً', true);
            return Promise.reject(e);
          } finally { isRefreshing = false; }
        }
        if (error.response?.status === 401) window.logout();
        return Promise.reject(error);
      }
    );

    // ============================================================
    // 4. HELPERS
    // ============================================================
    function showToast(msg, isError = false) {
      const wrap = document.getElementById('toast-wrap');
      const el = document.createElement('div');
      el.className = `toast ${isError ? 'error' : ''}`;
      el.textContent = msg;
      wrap.appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }

    function extractValidationErrors(error) {
      const data = error.response?.data;
      if (!data) return [];
      let messages = [];
      if (data.errors && typeof data.errors === 'object') {
        Object.values(data.errors).forEach(arr => {
          if (Array.isArray(arr)) messages.push(...arr);
        });
      } else if (data.message) {
        messages.push(data.message);
      } else if (data.title) {
        messages.push(data.title);
      }
      return messages;
    }

    function errMsg(err, fallback = 'حدث خطأ غير متوقع، حاول مرة أخرى') {
      const msgs = extractValidationErrors(err);
      if (msgs.length) return msgs.join(' | ');
      return fallback;
    }

    function getToken() { return localStorage.getItem('hs_token'); }
    function isLoggedIn() { return !!getToken(); }
    function clearSession() { ['hs_token', 'hs_refreshToken', 'hs_role', 'hs_name'].forEach(k => localStorage.removeItem(k)); }
    function logout() { clearSession(); window.location.reload(); }
    function persistSession(data) {
      localStorage.setItem('hs_token', data.accessToken);
      localStorage.setItem('hs_refreshToken', data.refreshToken);
      localStorage.setItem('hs_role', data.role || 'Owner');
      localStorage.setItem('hs_name', data.fullName || 'مستخدم');
    }

    // ============================================================
    // 5. MAIN APP
    // ============================================================
    function App() {
      const [user, setUser] = useState(null);
      const [activeView, setActiveView] = useState('dashboard');
      const [loading, setLoading] = useState(false);
      const [currentRole, setCurrentRole] = useState('Owner');
      const [isRealData, setIsRealData] = useState(false);
      const [userName, setUserName] = useState('');

      // --- بيانات الجداول ---
      const [vaccines, setVaccines] = useState([]);
      const [vaccinations, setVaccinations] = useState([]);
      const [healthLogs, setHealthLogs] = useState([]);
      const [cattleOptions, setCattleOptions] = useState([]);
      const [cattleList, setCattleList] = useState([]);
      const [cattleTotal, setCattleTotal] = useState(0);
      const [staffList, setStaffList] = useState([]);
      const [weeklyMilk, setWeeklyMilk] = useState([]);
      const [topProducers, setTopProducers] = useState([]);
      const [alerts, setAlerts] = useState([]);
      const [dailyMilk, setDailyMilk] = useState('—');
      const [loadError, setLoadError] = useState(false);

      // --- حالة النماذج ---
      const [showVaccineForm, setShowVaccineForm] = useState(false);
      const [showVaccinationForm, setShowVaccinationForm] = useState(false);
      const [showHealthForm, setShowHealthForm] = useState(false);
      const [showCattleForm, setShowCattleForm] = useState(false);

      // حساب الصلاحيات
      const permissions = useMemo(() => {
        const perms = ROLES_DEF[currentRole] || ROLES_DEF.Guest || ['view'];
        return perms;
      }, [currentRole]);

      const hasPermission = useCallback((action) => permissions.includes(action), [permissions]);

      // تحميل البيانات
      const loadData = useCallback(async () => {
        if (isLoggedIn()) {
          setLoading(true);
          setLoadError(false);
          const safe = (promise, fallback) => promise.catch(() => fallback);

          try {
            const [vacs, vaccs, logs, cattleRes, staff, milkTop] = await Promise.all([
              safe(axiosInstance.get(EP.vaccines + '?Page=1&PageSize=100').then(r => r.data.items || []), []),
              safe(axiosInstance.get(EP.vaccinations + '?Page=1&PageSize=100').then(r => r.data.items || []), []),
              safe(axiosInstance.get(EP.healthLogs + '?Page=1&PageSize=100').then(r => r.data.items || []), []),
              safe(axiosInstance.get(EP.cattle + '?Page=1&PageSize=100').then(r => r.data), { items: [], totalCount: 0 }),
              safe(axiosInstance.get(EP.users + '?Page=1&PageSize=100').then(r => r.data.items || []), []),
              safe(axiosInstance.get(EP.milkTop + '?Top=5').then(r => r.data || []), [])
            ]);
            setVaccines(vacs);
            setVaccinations(vaccs);
            setHealthLogs(logs);
            const cattleItems = cattleRes.items || [];
            setCattleList(cattleItems);
            setCattleOptions(cattleItems.map(c => ({ id: c.id, tagNumber: c.tagNumber })));
            setCattleTotal(cattleRes.totalCount ?? cattleItems.length);
            setStaffList(staff);
            setTopProducers(milkTop);

            const days = Array.from({ length: 7 }, (_, idx) => 6 - idx).map(i => {
              const d = new Date(); d.setDate(d.getDate() - i);
              const from = new Date(d); from.setHours(0, 0, 0, 0);
              const to = new Date(d); to.setHours(23, 59, 59, 999);
              return { from, to };
            });
            const weeklyResults = await Promise.all(
              days.map(({ from, to }) =>
                safe(axiosInstance.get(EP.milkSummary + `?from=${from.toISOString()}&to=${to.toISOString()}`).then(r => r.data.totalLiters || 0), 0)
              )
            );
            setWeeklyMilk(weeklyResults);
            setDailyMilk(weeklyResults.length ? weeklyResults[weeklyResults.length - 1].toLocaleString('en-US') : '0');

            setAlerts([]);
            setIsRealData(true);
          } catch (e) {
            showToast('تعذر تحميل بعض البيانات: ' + errMsg(e), true);
            setVaccines([]); setVaccinations([]); setHealthLogs([]);
            setCattleList([]); setCattleOptions([]); setCattleTotal(0);
            setStaffList([]); setTopProducers([]); setWeeklyMilk([]);
            setDailyMilk('—'); setAlerts([]);
            setIsRealData(true);
            setLoadError(true);
          } finally { setLoading(false); }
        } else {
          // وضع الضيف: بيانات تجريبية
          setVaccines(MOCK.vaccines);
          setVaccinations(MOCK.vaccinations);
          setHealthLogs(MOCK.healthLogs);
          setCattleOptions(MOCK.cattle.map(c => ({ id: c.id, tagNumber: c.tagNumber })));
          setCattleList(MOCK.cattle);
          setCattleTotal(MOCK.cattle.length);
          setStaffList(MOCK.staff);
          setTopProducers(MOCK.topProducers);
          setWeeklyMilk(MOCK.weeklyMilk);
          setDailyMilk('1,840');
          setAlerts(MOCK.alerts);
          setIsRealData(false);
          setLoadError(false);
          setLoading(false);
        }
      }, []);

      // ===== تهيئة المستخدم من التوكن =====
      useEffect(() => {
        if (isLoggedIn()) {
          const token = getToken();
          const decoded = decodeToken(token);
          const roles = decoded.roles || ['Owner'];
          const primaryRole = roles[0] || 'Owner';
          setCurrentRole(primaryRole);
          setUserName(decoded.name || localStorage.getItem('hs_name') || 'مستخدم');
          setUser({ name: decoded.name || localStorage.getItem('hs_name') || 'مستخدم', roles });
          loadData();
        } else {
          setCurrentRole('Owner');
          setUserName('ضيف');
          setUser({ name: 'ضيف', roles: ['Guest'] });
          loadData();
        }
      }, []);

      const handleRoleChange = (e) => {
        const newRole = e.target.value;
        setCurrentRole(newRole);
        showToast(`تم التبديل إلى دور: ${roleNames[newRole]}`);
      };

      const contextValue = {
        user,
        userName,
        currentRole,
        hasPermission,
        loading,
        vaccines, setVaccines,
        vaccinations, setVaccinations,
        healthLogs, setHealthLogs,
        cattleOptions,
        cattleList, setCattleList,
        cattleTotal,
        staffList, setStaffList,
        weeklyMilk,
        topProducers,
        dailyMilk,
        alerts, setAlerts,
        showVaccineForm, setShowVaccineForm,
        showVaccinationForm, setShowVaccinationForm,
        showHealthForm, setShowHealthForm,
        showCattleForm, setShowCattleForm,
        loadData,
        handleRoleChange,
        logout,
        isRealData,
        loadError
      };

      return (
        <AuthProvider value={contextValue}>
          <div className="app">
            <Topbar />
            <div className="app-body">
              <Sidebar activeView={activeView} setActiveView={setActiveView} />
              <main className="content">
                {activeView === 'dashboard' && <Dashboard setActiveView={setActiveView} />}
                {activeView === 'cattle' && <CattleManagement />}
                {activeView === 'health' && <HealthManagement />}
                {activeView === 'staff' && <StaffManagement />}
                {activeView === 'alerts' && <AlertsPage />}
              </main>
            </div>
          </div>
        </AuthProvider>
      );
    }

    // ============================================================
    // 6. CONTEXT
    // ============================================================
    const AuthContext = createContext(null);
    function AuthProvider({ children, value }) {
      return <AuthContext.Provider value={value}>{children}</AuthContext.Provider>;
    }
    function useAuth() {
      const ctx = useContext(AuthContext);
      if (!ctx) throw new Error('useAuth must be used within AuthProvider');
      return ctx;
    }

    // ============================================================
    // 6.1 ACTION BUTTON
    // ============================================================
    function ActionButton({ allowed, reason, onClick, children, className = '', small = true }) {
      if (allowed) {
        return (
          <button type="button" className={`btn ${small ? 'btn-small' : ''} ${className}`} onClick={onClick}>
            {children}
          </button>
        );
      }
      return (
        <span className="tip-wrap" tabIndex={0}>
          <button type="button" className={`btn ${small ? 'btn-small' : ''} locked`} disabled onClick={(e) => e.preventDefault()}>
            <span className="lock-ic">🔒</span>{children}
          </button>
          <span className="tip-bubble">{reason || 'لا تملك صلاحية هذا الإجراء'}</span>
        </span>
      );
    }

    // ============================================================
    // 7. TOPBAR & SIDEBAR
    // ============================================================
    function Topbar() {
      const { user, userName, currentRole, handleRoleChange } = useAuth();
      const isGuest = currentRole === 'Guest' || !isLoggedIn();

      return (
        <header className="topbar">
          <div className="brand"><span className="mark">🐄</span> هيردسمارت</div>
          <div className="top-right">
            <span className="status-badge"><span className="status-dot on"></span> {isLoggedIn() ? 'متصل' : 'تجريبي'}</span>
            {isGuest && (
              <div className="role-switch">
                <span>🧑‍🌾 تجربة كـ:</span>
                <select value={currentRole} onChange={handleRoleChange}>
                  <option value="Owner">مالك المزرعة</option>
                  <option value="Vet">بيطري</option>
                  <option value="Worker">عامل</option>
                </select>
              </div>
            )}
            {user && !isGuest && (
              <span className="user-chip">
                👋 <strong>{userName || user.name || 'مستخدم'}</strong>
                <span className="role-tag">{roleNames[currentRole] || currentRole}</span>
              </span>
            )}
            {isLoggedIn() ? (
              <button className="btn btn-outline btn-small" onClick={() => { window.logout(); }}>خروج</button>
            ) : (
              <>
                <button className="btn btn-outline btn-small" onClick={() => window.openAuthModal()}>دخول</button>
                <button className="btn btn-solid btn-small" onClick={() => window.openAuthModal()}>حساب جديد</button>
              </>
            )}
          </div>
        </header>
      );
    }

    function Sidebar({ activeView, setActiveView }) {
      const { hasPermission } = useAuth();
      const items = [
        { id: 'dashboard', icon: '📊', label: 'لوحة التحكم' },
        { id: 'cattle', icon: '🐮', label: 'الماشية' },
        { id: 'health', icon: '💉', label: 'الطبي والتطعيمات' },
        { id: 'alerts', icon: '📡', label: 'التنبيهات' }
      ];
      if (hasPermission('manageStaff')) {
        items.push({ id: 'staff', icon: '👥', label: 'الموظفين' });
      }
      return (
        <aside className="sidebar">
          {items.map(item => (
            <button
              key={item.id}
              className={`nav-item ${activeView === item.id ? 'active' : ''}`}
              onClick={() => setActiveView(item.id)}
            >
              <span className="nav-icon">{item.icon}</span>
              <span className="label">{item.label}</span>
            </button>
          ))}
          <div className="sidebar-foot">v1.0.0</div>
        </aside>
      );
    }

    // ============================================================
    // 8. DASHBOARD
    // ============================================================
    const FEATURES = [
      { icon: '🐮', title: 'إدارة الماشية', desc: 'سجل كامل لكل رأس: السلالة، النسب، الحالة الصحية' },
      { icon: '💉', title: 'اللقاحات والتطعيمات', desc: 'جدولة وتتبع تلقائي حسب عمر كل بقرة' },
      { icon: '🩺', title: 'السجلات الصحية', desc: 'تشخيص وخطط علاج موثقة لكل حالة' },
      { icon: '🥛', title: 'إنتاج الحليب', desc: 'تتبع يومي وأسبوعي وأعلى المنتجات' },
      { icon: '📡', title: 'تنبيهات لحظية', desc: 'إشعارات فورية عند خلل في المؤشرات الحيوية' },
      { icon: '👥', title: 'إدارة الموظفين', desc: 'صلاحيات دقيقة لكل دور داخل المزرعة' }
    ];

    function Dashboard({ setActiveView }) {
      const {
        cattleOptions,
        cattleTotal,
        topProducers,
        dailyMilk,
        weeklyMilk,
        alerts,
        hasPermission,
        isRealData,
        loading,
        currentRole
      } = useAuth();

      const totalCattle = isRealData ? (cattleTotal || 0) : (cattleOptions.length || 0);
      const activeAlerts = alerts.filter(a => a.active).length;
      const isGuest = currentRole === 'Guest' || !isLoggedIn();

      const [temp, setTemp] = useState(6.5);
      const [move, setMove] = useState(5.2);

      useEffect(() => {
        if (isRealData) return;
        const interval = setInterval(() => {
          setTemp(Math.max(1, Math.min(10, Math.round((5 + (Math.random() - 0.5) * 6) * 10) / 10)));
          setMove(Math.max(1, Math.min(10, Math.round((5 + (Math.random() - 0.5) * 6) * 10) / 10)));
        }, 4000);
        return () => clearInterval(interval);
      }, [isRealData]);

      const gaugeColor = (v) => v >= 9 ? '#A85234' : v >= 7 ? '#C79A45' : '#3C6B41';

      const totalMilkWeek = weeklyMilk.reduce((a, b) => a + b, 0) || 0;
      const avgMilk = weeklyMilk.length ? Math.round(totalMilkWeek / weeklyMilk.length) : 0;

      if (loading) return <div className="loading-box"><span className="spinner"></span>جاري تحميل لوحة التحكم...</div>;

      return (
        <div>
          <div className="view-head">
            <div><h1>📊 لوحة التحكم</h1><p>نظرة عامة لحظية على المزرعة</p></div>
            <span className="live-badge"><span className="live-dot"></span> {isRealData ? 'بيانات حية من مزرعتك' : 'بيانات تجريبية للعرض فقط'}</span>
          </div>

          {isGuest && (
            <div className="feature-hero">
              <h2>🌾 هيردسمارت — نظام إدارة المزرعة الذكي</h2>
              <p>أنت الآن تتصفح نسخة تجريبية ببيانات وهمية. أنشئ حساب مزرعتك لتبدأ بإدخال بيانات ماشيتك الحقيقية وتتابع كل شيء أولاً بأول.</p>
              <div className="feature-grid">
                {FEATURES.map((f, i) => (
                  <div className="feature-chip" key={i}>
                    <div className="fc-ic">{f.icon}</div>
                    <div className="fc-title">{f.title}</div>
                    <div className="fc-desc">{f.desc}</div>
                  </div>
                ))}
              </div>
              <div className="modal-actions" style={{ marginTop: '18px', maxWidth: '260px' }}>
                <button className="btn btn-solid" style={{ background: '#fff', color: 'var(--green-deep)' }} onClick={() => window.openAuthModal()}>ابدأ الآن مجاناً</button>
              </div>
            </div>
          )}

          <div className="stat-row">
            <div className="stat-card" style={{ cursor: 'pointer' }} onClick={() => setActiveView && setActiveView('cattle')}>
              <div className="label">إجمالي الماشية</div>
              <div className="value num">{totalCattle}</div>
              <div className="sub">رأس</div>
            </div>
            <div className="stat-card">
              <div className="label">إنتاج اليوم</div>
              <div className="value num">{dailyMilk}</div>
              <div className="sub">لتر</div>
            </div>
            <div className="stat-card" style={{ cursor: 'pointer' }} onClick={() => setActiveView && setActiveView('alerts')}>
              <div className="label">التنبيهات النشطة</div>
              <div className="value num rust">{activeAlerts}</div>
              <div className="sub">مستشعرات</div>
            </div>
          </div>

          <div className="panel-grid">
            <div className="card-box">
              <h4>📈 إنتاج الأسبوع <span className="milk-drop">🥛</span></h4>
              {totalMilkWeek === 0 && weeklyMilk.every(v => v === 0) ? (
                <div className="empty-state">
                  <div className="es-ic">🥛</div>
                  <div className="es-title">لا يوجد إنتاج حليب مسجّل بعد</div>
                  <div className="es-sub">ابدأ بتسجيل جلسات الحلب اليومية لتظهر هنا.</div>
                </div>
              ) : (
                <>
                  <div style={{ fontSize: '1.1rem', fontWeight: 700, color: 'var(--green-deep)', padding: '8px 0' }}>
                    إجمالي: {totalMilkWeek.toLocaleString()} لتر
                  </div>
                  <div style={{ fontSize: '.85rem', color: 'var(--ink-soft)' }}>
                    المعدل اليومي: {avgMilk} لتر
                  </div>
                  <div style={{ marginTop: 12, display: 'flex', gap: '4px', alignItems: 'flex-end', height: '60px' }}>
                    {weeklyMilk.map((v, i) => {
                      const height = Math.max(4, (v / (Math.max(...weeklyMilk, 100)) * 50));
                      return (
                        <div key={i} style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
                          <div style={{
                            width: '100%',
                            height: height + 'px',
                            background: 'var(--green)',
                            borderRadius: '4px 4px 0 0',
                            transition: 'height .5s cubic-bezier(.4,0,.2,1)'
                          }}></div>
                          <span style={{ fontSize: '.6rem', color: 'var(--ink-soft)', marginTop: 2 }}>يوم</span>
                        </div>
                      );
                    })}
                  </div>
                </>
              )}
            </div>

            <div className="card-box">
              <h4>📡 المستشعرات {!isRealData && <span className="live-badge"><span className="live-dot"></span> عرض تجريبي</span>}</h4>
              {isRealData ? (
                <div className="empty-state">
                  <div className="es-ic">📶</div>
                  <div className="es-title">لا توجد أجهزة استشعار مربوطة بعد</div>
                  <div className="es-sub">بمجرد ربط أجهزة استشعار المزرعة، ستظهر قراءات الحرارة والحركة هنا لحظياً.</div>
                </div>
              ) : (
                <div className="gauge-grid">
                  <div className="gauge">
                    <div className="g-label">🌡️ الحرارة</div>
                    <div className="g-value num" style={{ color: gaugeColor(temp) }}>{temp.toFixed(1)}/10</div>
                    <div className="g-bar"><div className="g-fill" style={{ width: temp * 10 + '%', background: gaugeColor(temp) }}></div></div>
                  </div>
                  <div className="gauge">
                    <div className="g-label">🏃 الحركة</div>
                    <div className="g-value num" style={{ color: gaugeColor(move) }}>{move.toFixed(1)}/10</div>
                    <div className="g-bar"><div className="g-fill" style={{ width: move * 10 + '%', background: gaugeColor(move) }}></div></div>
                  </div>
                </div>
              )}
              <div style={{ marginTop: 16 }}>
                <h4 style={{ fontSize: '.9rem' }}>🏆 أعلى الإنتاج</h4>
                {topProducers.length === 0 ? (
                  <div className="empty-state"><div className="es-sub">لا توجد بيانات إنتاج كافية بعد</div></div>
                ) :
                  topProducers.map((p, i) => (
                    <div key={i} className="producer-row">
                      <span>🐄 #{p.tagNumber}</span>
                      <span className="liters num">{Number(p.totalLiters).toFixed(1)} لتر</span>
                    </div>
                  ))
                }
              </div>
            </div>
          </div>

          <div className="card-box">
            <h4>🔔 آخر التنبيهات</h4>
            {alerts.length === 0 ? (
              <div className="empty-state">
                <div className="es-ic">{isRealData ? '📡' : '🎉'}</div>
                <div className="es-title">{isRealData ? 'لا توجد تنبيهات — لم يتم ربط مستشعرات بعد' : 'لا توجد تنبيهات نشطة حالياً'}</div>
              </div>
            ) :
              alerts.slice(0, 3).map(a => (
                <div key={a.id} className="alert-item">
                  <span className={`dot ${a.active ? 'red' : 'gray'}`}></span>
                  <div className="body">
                    <div><strong>{a.text}</strong></div>
                    <div className="meta">{a.time} · <span className={`badge ${a.active ? 'active' : 'ok'}`}>{a.active ? 'نشط' : 'تم الحل'}</span></div>
                  </div>
                </div>
              ))
            }
          </div>
        </div>
      );

    // ============================================================
    // 8.5 CATTLE MANAGEMENT
    // ============================================================
    function CattleManagement() {
      const {
        currentRole, hasPermission, loading,
        cattleList, setCattleList, cattleTotal,
        showCattleForm, setShowCattleForm,
        loadData, isRealData
      } = useAuth();

      const emptyForm = { tagNumber: '', breed: '', gender: 0, birthDate: '', fatherTagNumber: '', motherTagNumber: '' };
      const [form, setForm] = useState(emptyForm);
      const [errors, setErrors] = useState({});
      const [search, setSearch] = useState('');
      const [statusFilter, setStatusFilter] = useState('all');
      const [savingStatusId, setSavingStatusId] = useState(null);
      const [deletingId, setDeletingId] = useState(null);

      const validate = () => {
        const err = {};
        if (!form.tagNumber.trim()) err.tagNumber = 'رقم التاج مطلوب';
        if (!form.breed.trim()) err.breed = 'السلالة مطلوبة';
        if (!form.birthDate) err.birthDate = 'تاريخ الميلاد مطلوب';
        else if (new Date(form.birthDate) > new Date()) err.birthDate = 'تاريخ الميلاد لا يمكن أن يكون في المستقبل';
        setErrors(err);
        return Object.keys(err).length === 0;
      };

      const handleAdd = async (e) => {
        e.preventDefault();
        if (!hasPermission('create_cattle')) { showToast('⚠️ ليس لديك صلاحية لإضافة ماشية', true); return; }
        if (!validate()) return;
        try {
          const payload = {
            tagNumber: form.tagNumber.trim(),
            breed: form.breed.trim(),
            gender: Number(form.gender),
            birthDate: new Date(form.birthDate).toISOString(),
            fatherTagNumber: form.fatherTagNumber.trim() || null,
            motherTagNumber: form.motherTagNumber.trim() || null
          };
          const res = await axiosInstance.post(EP.cattle, payload);
          setCattleList([res.data, ...cattleList]);
          setShowCattleForm(false);
          setForm(emptyForm);
          showToast('✅ تم تسجيل رأس الماشية بنجاح');
          loadData();
        } catch (err) {
          showToast('فشل الإضافة: ' + errMsg(err), true);
        }
      };

      const handleStatusChange = async (cattle, newStatus) => {
        if (!hasPermission('edit_cattle')) { showToast('⚠️ ليس لديك صلاحية لتعديل حالة الماشية', true); return; }
        setSavingStatusId(cattle.id);
        try {
          await axiosInstance.put(EP.cattleStatus(cattle.id), { id: cattle.id, newStatus: Number(newStatus) });
          setCattleList(cattleList.map(c => c.id === cattle.id ? { ...c, status: Number(newStatus) } : c));
          showToast('✅ تم تحديث حالة الماشية');
        } catch (err) {
          showToast('فشل تحديث الحالة: ' + errMsg(err), true);
        } finally { setSavingStatusId(null); }
      };

      const handleDelete = async (cattle) => {
        if (!isRealData) { showToast('⚠️ لا يمكن حذف بيانات تجريبية', true); return; }
        if (!hasPermission('delete_cattle')) {
          showToast('⚠️ حذف الماشية متاح فقط لمالك المزرعة', true);
          return;
        }
        if (!window.confirm(`هل أنت متأكد من حذف رأس الماشية رقم ${cattle.tagNumber}؟ لا يمكن التراجع عن هذا الإجراء.`)) return;
        setDeletingId(cattle.id);
        try {
          await axiosInstance.delete(EP.cattleOne(cattle.id));
          setCattleList(cattleList.filter(c => c.id !== cattle.id));
          showToast('✅ تم حذف رأس الماشية');
          loadData();
        } catch (err) {
          const msg = errMsg(err, 'حدث خطأ أثناء الحذف، تأكد من أن لديك صلاحية الحذف وأن البقرة غير مرتبطة ببيانات أخرى.');
          showToast('فشل الحذف: ' + msg, true);
        } finally { setDeletingId(null); }
      };

      const filtered = cattleList.filter(c => {
        const matchesSearch = !search || c.tagNumber?.toLowerCase().includes(search.toLowerCase()) || c.breed?.toLowerCase().includes(search.toLowerCase());
        const matchesStatus = statusFilter === 'all' || String(c.status) === statusFilter;
        return matchesSearch && matchesStatus;
      });

      const ageLabel = (birthDate) => {
        if (!birthDate) return '—';
        const months = Math.max(0, Math.floor((Date.now() - new Date(birthDate)) / (1000 * 60 * 60 * 24 * 30.44)));
        if (months < 12) return `${months} شهر`;
        return `${Math.floor(months / 12)} سنة و ${months % 12} شهر`;
      };

      if (loading) return <div className="loading-box"><span className="spinner"></span>جاري تحميل بيانات الماشية...</div>;

      return (
        <div>
          <div className="view-head">
            <div><h1>🐮 إدارة الماشية</h1><p>سجل كامل لقطيع المزرعة — {cattleTotal} رأس {isRealData ? '' : '(بيانات تجريبية)'}</p></div>
            <ActionButton
              allowed={hasPermission('create_cattle') && isRealData}
              reason="إضافة ماشية جديدة متاحة لمالك المزرعة والطبيب البيطري فقط"
              className="btn-solid"
              onClick={() => setShowCattleForm(true)}
            >
              + تسجيل رأس ماشية
            </ActionButton>
          </div>

          {showCattleForm && hasPermission('create_cattle') && isRealData && (
            <div className="card-box">
              <h4>تسجيل رأس ماشية جديد</h4>
              <form onSubmit={handleAdd}>
                <div className="form-grid-3">
                  <div className="field">
                    <label>رقم التاج *</label>
                    <input type="text" value={form.tagNumber} onChange={e => setForm({ ...form, tagNumber: e.target.value })} placeholder="مثال: A501" />
                    {errors.tagNumber && <span className="field-error">{errors.tagNumber}</span>}
                  </div>
                  <div className="field">
                    <label>السلالة *</label>
                    <input type="text" value={form.breed} onChange={e => setForm({ ...form, breed: e.target.value })} placeholder="مثال: هولشتاين" />
                    {errors.breed && <span className="field-error">{errors.breed}</span>}
                  </div>
                  <div className="field">
                    <label>الجنس *</label>
                    <select value={form.gender} onChange={e => setForm({ ...form, gender: e.target.value })}>
                      <option value={0}>ذكر</option>
                      <option value={1}>أنثى</option>
                    </select>
                  </div>
                  <div className="field">
                    <label>تاريخ الميلاد *</label>
                    <input type="date" value={form.birthDate} onChange={e => setForm({ ...form, birthDate: e.target.value })} />
                    {errors.birthDate && <span className="field-error">{errors.birthDate}</span>}
                  </div>
                  <div className="field">
                    <label>رقم تاج الأب (اختياري)</label>
                    <input type="text" value={form.fatherTagNumber} onChange={e => setForm({ ...form, fatherTagNumber: e.target.value })} />
                  </div>
                  <div className="field">
                    <label>رقم تاج الأم (اختياري)</label>
                    <input type="text" value={form.motherTagNumber} onChange={e => setForm({ ...form, motherTagNumber: e.target.value })} />
                  </div>
                </div>
                <div className="modal-actions">
                  <button type="submit" className="btn btn-solid">حفظ</button>
                  <button type="button" className="btn btn-outline" onClick={() => { setShowCattleForm(false); setForm(emptyForm); setErrors({}); }}>إلغاء</button>
                </div>
              </form>
            </div>
          )}

          <div className="card-box">
            <h4>
              القطيع
              <span style={{ display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
                <input
                  type="text" placeholder="بحث برقم التاج أو السلالة..." value={search}
                  onChange={e => setSearch(e.target.value)}
                  style={{ padding: '6px 10px', borderRadius: '8px', border: '1px solid var(--line)', fontSize: '.8rem', minWidth: '180px' }}
                />
                <select value={statusFilter} onChange={e => setStatusFilter(e.target.value)} style={{ padding: '6px 10px', borderRadius: '8px', border: '1px solid var(--line)', fontSize: '.8rem' }}>
                  <option value="all">كل الحالات</option>
                  {Object.entries(CATTLE_STATUS_MAP).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
                </select>
              </span>
            </h4>
            <div className="table-scroll">
            <table>
              <thead><tr><th>رقم التاج</th><th>السلالة</th><th>الجنس</th><th>العمر</th><th>الأب/الأم</th><th>الحالة</th><th>إجراء</th></tr></thead>
              <tbody>
                {filtered.length === 0 ? (
                  <tr><td colSpan="7"><div className="empty-state"><div className="es-ic">🐄</div><div className="es-title">لا توجد نتائج</div><div className="es-sub">جرّب تعديل البحث أو الفلتر، أو سجّل أول رأس ماشية.</div></div></td></tr>
                ) : filtered.map(c => (
                  <tr key={c.id}>
                    <td><strong>{c.tagNumber}</strong></td>
                    <td>{c.breed}</td>
                    <td><span className="gender-ic">{GENDER_MAP[c.gender]?.icon}</span> {GENDER_MAP[c.gender]?.label || '—'}</td>
                    <td>{ageLabel(c.birthDate)}</td>
                    <td style={{ fontSize: '.78rem', color: 'var(--ink-soft)' }}>{c.fatherTagNumber || '—'} / {c.motherTagNumber || '—'}</td>
                    <td>
                      {hasPermission('edit_cattle') && isRealData ? (
                        <select
                          value={c.status} disabled={savingStatusId === c.id}
                          onChange={e => handleStatusChange(c, e.target.value)}
                          style={{ padding: '3px 8px', borderRadius: '999px', border: 'none', fontSize: '.7rem', fontWeight: 700, background: '#F1E3BE', color: 'var(--gold)' }}
                        >
                          {Object.entries(CATTLE_STATUS_MAP).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
                        </select>
                      ) : (
                        <span className={`badge ${CATTLE_STATUS_MAP[c.status]?.cls || 'ok'}`}>{CATTLE_STATUS_MAP[c.status]?.label || '—'}</span>
                      )}
                    </td>
                    <td>
                      <ActionButton
                        allowed={hasPermission('delete_cattle') && isRealData}
                        reason="حذف الماشية متاح فقط لمالك المزرعة"
                        className="btn-outline"
                        onClick={() => handleDelete(c)}
                      >
                        {deletingId === c.id ? '...' : '🗑️ حذف'}
                      </ActionButton>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
            </div>
          </div>
        </div>
      );
    }

    // ============================================================
    // 9. HEALTH MANAGEMENT
    // ============================================================
    function HealthManagement() {
      const {
        currentRole,
        hasPermission,
        loading,
        vaccines, setVaccines,
        vaccinations, setVaccinations,
        healthLogs, setHealthLogs,
        cattleOptions,
        showVaccineForm, setShowVaccineForm,
        showVaccinationForm, setShowVaccinationForm,
        showHealthForm, setShowHealthForm,
        loadData,
        isRealData
      } = useAuth();

      const [vaccineForm, setVaccineForm] = useState({ name: '', targetAgeInMonths: '', dosage: '', intervalInDays: '' });
      const [vaccineErrors, setVaccineErrors] = useState({});
      const [vaccinationForm, setVaccinationForm] = useState({ cattleId: '', vaccineId: '', scheduledDate: '' });
      const [vaccinationErrors, setVaccinationErrors] = useState({});
      const [healthForm, setHealthForm] = useState({ cattleId: '', diagnosis: '', treatmentPlan: '', vetNotes: '', isContagious: false });
      const [healthErrors, setHealthErrors] = useState({});
      const [submittingHealth, setSubmittingHealth] = useState(false);

      const vaccineOptions = vaccines.map(v => ({ id: v.id, name: v.name }));

      const validateVaccine = () => {
        const err = {};
        if (!vaccineForm.name.trim()) err.name = 'اسم اللقاح مطلوب';
        const age = Number(vaccineForm.targetAgeInMonths);
        if (isNaN(age) || age < 0) err.targetAgeInMonths = 'العمر يجب أن يكون 0 أو أكبر';
        const dose = Number(vaccineForm.dosage);
        if (isNaN(dose) || dose < 0) err.dosage = 'الجرعة يجب أن تكون 0 أو أكبر';
        if (vaccineForm.intervalInDays && Number(vaccineForm.intervalInDays) < 0) err.intervalInDays = 'الفاصل يجب أن يكون 0 أو أكبر';
        setVaccineErrors(err);
        return Object.keys(err).length === 0;
      };

      const validateVaccination = () => {
        const err = {};
        if (!vaccinationForm.cattleId) err.cattleId = 'اختر بقرة';
        if (!vaccinationForm.vaccineId) err.vaccineId = 'اختر لقاح';
        if (!vaccinationForm.scheduledDate) err.scheduledDate = 'حدد التاريخ';
        setVaccinationErrors(err);
        return Object.keys(err).length === 0;
      };

      const validateHealth = () => {
        const err = {};
        if (!healthForm.cattleId) err.cattleId = 'اختر بقرة';
        if (!healthForm.diagnosis.trim()) err.diagnosis = 'التشخيص مطلوب';
        if (!healthForm.treatmentPlan.trim()) err.treatmentPlan = 'خطة العلاج مطلوبة';
        setHealthErrors(err);
        return Object.keys(err).length === 0;
      };

      const canCreateVaccine = currentRole === VACCINE_CREATOR_ROLE && isRealData;
      const canScheduleVaccination = hasPermission('schedule_vaccination') && isRealData;
      const canAdminister = currentRole === VACCINATION_ADMINISTER_ROLE && isRealData;
      const canEditHealth = currentRole === HEALTH_LOG_EDITOR_ROLE && isRealData;

      const handleAddVaccine = async (e) => {
        e.preventDefault();
        if (!canCreateVaccine) { showToast('⚠️ إضافة أنواع اللقاحات مسؤولية الطبيب البيطري فقط', true); return; }
        if (!validateVaccine()) return;
        try {
          const payload = {
            name: vaccineForm.name,
            targetAgeInMonths: Number(vaccineForm.targetAgeInMonths),
            dosage: Number(vaccineForm.dosage),
            intervalInDays: vaccineForm.intervalInDays ? Number(vaccineForm.intervalInDays) : null
          };
          const res = await axiosInstance.post(EP.vaccines, payload);
          setVaccines([...vaccines, res.data]);
          setShowVaccineForm(false);
          setVaccineForm({ name: '', targetAgeInMonths: '', dosage: '', intervalInDays: '' });
          showToast('✅ تم إضافة اللقاح');
          loadData();
        } catch (err) {
          showToast('فشل الإضافة: ' + errMsg(err), true);
        }
      };

      const handleAddVaccination = async (e) => {
        e.preventDefault();
        if (!canScheduleVaccination) { showToast('⚠️ جدولة التطعيم متاحة للطبيب البيطري فقط', true); return; }
        if (!validateVaccination()) return;
        try {
          const payload = {
            cattleId: vaccinationForm.cattleId,
            vaccineId: vaccinationForm.vaccineId,
            scheduledDate: new Date(vaccinationForm.scheduledDate).toISOString()
          };
          const res = await axiosInstance.post(EP.vaccinations, payload);
          setVaccinations([...vaccinations, res.data]);

    const PASSWORD_RULES = [
      { key: 'len', label: '8 أحرف على الأقل', test: (p) => p.length >= 8 },
      { key: 'upper', label: 'حرف إنجليزي كبير واحد على الأقل (A-Z)', test: (p) => /[A-Z]/.test(p) },
      { key: 'lower', label: 'حرف إنجليزي صغير واحد على الأقل (a-z)', test: (p) => /[a-z]/.test(p) },
      { key: 'num', label: 'رقم واحد على الأقل (0-9)', test: (p) => /[0-9]/.test(p) },
      { key: 'special', label: 'رمز خاص واحد على الأقل (!@#$...)', test: (p) => /[^A-Za-z0-9]/.test(p) }
    ];
    function passwordScore(p) { return PASSWORD_RULES.filter(r => r.test(p)).length; }

    function PasswordChecklist({ password }) {
      const score = passwordScore(password);
      const pct = (score / PASSWORD_RULES.length) * 100;
      const barColor = score <= 1 ? 'var(--rust)' : score <= 3 ? 'var(--gold)' : 'var(--green)';
      return (
        <div>
          <div className="pw-strength-bar"><div className="pw-strength-fill" style={{ width: pct + '%', background: barColor }}></div></div>
          <ul className="pw-checklist">
            {PASSWORD_RULES.map(r => {
              const ok = r.test(password);
              return (
                <li key={r.key} className={ok ? 'ok' : ''}>
                  <span className="pw-ic">{ok ? '✓' : '•'}</span>{r.label}
                </li>
              );
            })}
          </ul>
        </div>
      );
    }

    function AuthModal({ onLogin }) {
      const [tab, setTab] = useState('login');
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [farmName, setFarmName] = useState('');
      const [ownerName, setOwnerName] = useState('');
      const [error, setError] = useState('');
      const [submitting, setSubmitting] = useState(false);
      const [touchedPassword, setTouchedPassword] = useState(false);

      const switchTab = (t) => { setTab(t); setError(''); };

      const isPasswordValid = tab === 'login' ? password.length > 0 : passwordScore(password) === PASSWORD_RULES.length;

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError('');
        if (tab === 'register' && !isPasswordValid) {
          setTouchedPassword(true);
          setError('كلمة المرور لا تحقق كل الشروط المطلوبة بالأسفل');
          return;
        }
        setSubmitting(true);
        try {
          if (tab === 'login') {
            await onLogin(email, password);
            document.getElementById('authModal').classList.add('hidden');
          } else {
            const res = await axiosInstance.post(EP.register, { farmName, ownerName, email, password });
            if (res.data.accessToken) {
              persistSession(res.data);
              window.location.reload();
            }
          }
        } catch (err) {
          const msgs = extractValidationErrors(err);
          setError(msgs.length ? msgs.join(' | ') : errMsg(err));
        } finally { setSubmitting(false); }
      };

      return (
        <div className="modal-overlay hidden" id="authModal">
          <div className="modal">
            <button className="modal-close" onClick={() => document.getElementById('authModal').classList.add('hidden')}>✕</button>
            <div className="auth-tabs">
              <button className={`auth-tab ${tab === 'login' ? 'active' : ''}`} onClick={() => switchTab('login')}>تسجيل الدخول</button>
              <button className={`auth-tab ${tab === 'register' ? 'active' : ''}`} onClick={() => switchTab('register')}>حساب جديد</button>
            </div>
            <form onSubmit={handleSubmit}>
              {tab === 'register' && (
                <>
                  <div className="field"><label>اسم المزرعة</label><input type="text" value={farmName} onChange={e => setFarmName(e.target.value)} required /></div>
                  <div className="field"><label>اسم المالك</label><input type="text" value={ownerName} onChange={e => setOwnerName(e.target.value)} required /></div>
                </>
              )}
              <div className="field"><label>البريد الإلكتروني</label><input type="email" value={email} onChange={e => setEmail(e.target.value)} required /></div>
              <div className="field">
                <label>كلمة المرور</label>
                <input
                  type="password" value={password} required
                  onFocus={() => setTouchedPassword(true)}
                  onChange={e => setPassword(e.target.value)}
                />
                {tab === 'register' && (touchedPassword || password.length > 0) && <PasswordChecklist password={password} />}
              </div>
              {error && <div className="field-error">{error}</div>}
              <div className="modal-actions">
                <button type="submit" className="btn btn-solid" disabled={submitting || (tab === 'register' && !isPasswordValid)}>
                  {submitting ? '...جاري المعالجة' : (tab === 'login' ? 'دخول' : 'إنشاء الحساب')}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // ============================================================
    // 13. RENDER
    // ============================================================
    window.openAuthModal = () => document.getElementById('authModal').classList.remove('hidden');
    window.logout = logout;

    const Root = () => {
      const handleLogin = async (email, password) => {
        try {
          const res = await axiosInstance.post(EP.login, { email, password });
          persistSession(res.data);
          window.location.reload();
        } catch (err) {
          throw err;
        }
      };

      return (
        <>
          <AuthModal onLogin={handleLogin} />
          <App />
        </>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
  </script>
</body>
</html>
